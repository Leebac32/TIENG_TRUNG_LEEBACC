<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIẾNG TRUNG LEEBACC</title>

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #222;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 10px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    background: linear-gradient(135deg,#1677ff,#005bea);
    color: white;
    border-radius: 18px;
    padding: 20px 12px;
    text-align: center;
    margin-bottom: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 6px 0 0;
    font-size: 13px;
    opacity: 0.95;
}


/* =====================================================
   HSK MENU
===================================================== */

.menu {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 6px;
    margin-bottom: 7px;
}

.menu button {
    border: none;
    background: white;
    border-radius: 10px;
    padding: 8px 4px;
    font-size: 14px;
    font-weight: 700;
    color: #444;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,0.05);
}

.menu button.active {
    background: #1677ff;
    color: white;
}


/* =====================================================
   STATS - NHỎ 50%
===================================================== */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 4px;
    margin-bottom: 6px;
}

.stat {
    background: white;
    border-radius: 7px;
    padding: 4px 2px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.stat-number {
    font-size: 10px;
    line-height: 12px;
    font-weight: 700;
}

.stat-label {
    font-size: 6px;
    line-height: 8px;
    color: #777;
    margin-top: 1px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {
    height: 5px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #1677ff;
    transition: width 0.25s;
}


/* =====================================================
   CARD
===================================================== */

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.07);
}

.mode-title {
    text-align: center;
    font-size: 14px;
    color: #1677ff;
    font-weight: 700;
    margin-bottom: 16px;
}


/* =====================================================
   QUESTION
===================================================== */

.question {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    min-height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
}

.question.vi {
    font-size: 25px;
    color: #333;
}


/* =====================================================
   PINYIN
===================================================== */

.pinyin {
    text-align: center;
    font-size: 19px;
    color: #1677ff;
    font-weight: 600;
    min-height: 25px;
    margin-bottom: 8px;
}


/* =====================================================
   INPUT
===================================================== */

input {
    width: 100%;
    padding: 13px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 20px;
    text-align: center;
    outline: none;
    transition: 0.2s;
    background: white;
}

input:focus {
    border-color: #1677ff;
}


/* ĐÚNG */

.input-correct {
    border-color: #22c55e !important;
    background: #f0fdf4 !important;
    color: #15803d !important;
}


/* SAI */

.input-wrong {
    border-color: #ef4444 !important;
    background: #fef2f2 !important;
    color: #dc2626 !important;
}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 10px;
}

.actions button {
    border: none;
    border-radius: 11px;
    padding: 11px 7px;
    background: #1677ff;
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.actions button:active {
    transform: scale(0.98);
}


/* =====================================================
   RESULT
===================================================== */

.result {
    margin-top: 10px;
    text-align: center;
    min-height: 0;
}

.result.correct {
    color: #16a34a;
}

.result.wrong {
    color: #dc2626;
}

.answer {
    margin-top: 5px;
    font-size: 21px;
    font-weight: 700;
    color: #222;
}

.answer-pinyin {
    margin-top: 3px;
    color: #1677ff;
    font-size: 17px;
    font-weight: 600;
}


/* =====================================================
   HINT
===================================================== */

.info {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 10px;
    min-height: 16px;
}

.hint {
    color: #f59e0b;
    font-weight: 600;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:430px) {

    .container {
        padding: 7px;
    }

    .header {
        padding: 16px 8px;
        border-radius: 15px;
    }

    .header h1 {
        font-size: 21px;
    }

    .header p {
        font-size: 12px;
    }

    .menu button {
        font-size: 13px;
        padding: 8px 3px;
    }

    .card {
        padding: 15px;
    }

    .question.vi {
        font-size: 22px;
    }

    input {
        font-size: 18px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>🇨🇳 TIẾNG TRUNG LEEBACC</h1>

    <p>
        Luyện viết chữ Hán
    </p>

</div>


<!-- =====================================================
     HSK MENU
===================================================== -->

<div class="menu">

    <button
        id="hsk1Button"
        class="active"
        onclick="selectHSK(1)"
    >
        HSK 1
    </button>


    <button
        id="hsk2Button"
        onclick="selectHSK(2)"
    >
        HSK 2
    </button>


    <button
        id="hsk3Button"
        onclick="selectHSK(3)"
    >
        HSK 3
    </button>

</div>


<!-- =====================================================
     STATS
===================================================== -->

<div class="stats">

    <div class="stat">

        <div
            id="correctCount"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            Đúng
        </div>

    </div>


    <div class="stat">

        <div
            id="wrongCount"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            Sai
        </div>

    </div>


    <div class="stat">

        <div
            id="doneCount"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            Đã làm
        </div>

    </div>


    <div class="stat">

        <div
            id="accuracy"
            class="stat-number"
        >
            0%
        </div>

        <div class="stat-label">
            Tỷ lệ
        </div>

    </div>

</div>


<!-- =====================================================
     PROGRESS
===================================================== -->

<div class="progress">

    <div
        id="progressFill"
        class="progress-fill"
    ></div>

</div>


<!-- =====================================================
     CARD
===================================================== -->

<div class="card">

    <div
        id="modeTitle"
        class="mode-title"
    >
        HSK 1 • LUYỆN VIẾT
    </div>


    <div
        id="question"
        class="question vi"
    >
        Đang tải...
    </div>


    <div
        id="pinyin"
        class="pinyin"
    ></div>


    <input
        id="answerInput"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Nhập chữ Hán..."
    >


    <!-- =================================================
         BUTTONS
    ================================================== -->

    <div class="actions">

        <button onclick="showPreviousQuestion()">
            ← Câu vừa làm
        </button>


        <button onclick="shuffleCurrentLevel()">
            🔀 Xáo trộn
        </button>

    </div>


    <div
        id="result"
        class="result"
    ></div>


    <div
        id="hint"
        class="info"
    >
        Sai 3 lần sẽ hiện đáp án.
    </div>

</div>

</div>


<script>


/* =====================================================
   DỮ LIỆU HSK
===================================================== */

const hskData = {

    1:
        Array.isArray(window.HSK1)
            ? [...window.HSK1]
            : [],

    2:
        Array.isArray(window.HSK2)
            ? [...window.HSK2]
            : [],

    3:
        Array.isArray(window.HSK3)
            ? [...window.HSK3]
            : []

};


/* =====================================================
   HSK HIỆN TẠI
===================================================== */

let currentHSK = 1;


/* =====================================================
   VỊ TRÍ CÂU
===================================================== */

let currentIndex = 0;


/* =====================================================
   CÂU HIỆN TẠI
===================================================== */

let currentQuestion = null;


/* =====================================================
   SỐ LẦN SAI CỦA CÂU HIỆN TẠI
===================================================== */

let wrongAttempts = 0;


/* =====================================================
   ĐÃ HIỆN ĐÁP ÁN SAU 3 LẦN SAI
===================================================== */

let answerShown = false;


/* =====================================================
   CÂU ĐÃ HOÀN THÀNH
===================================================== */

let questionCompleted = false;


/* =====================================================
   CÂU VỪA LÀM
===================================================== */

let lastQuestion = null;

let hasPreviousQuestion = false;


/* =====================================================
   TIMER
===================================================== */

let nextTimer = null;


/* =====================================================
   THỐNG KÊ
===================================================== */

let correctCount = 0;

let wrongCount = 0;

let doneCount = 0;


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        const temp =
            array[i];


        array[i] =
            array[j];


        array[j] =
            temp;

    }

}


/* =====================================================
   CHỌN HSK
===================================================== */

function selectHSK(level) {

    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }


    currentHSK = level;

    currentIndex = 0;

    wrongAttempts = 0;

    answerShown = false;

    questionCompleted = false;


    document
        .getElementById("hsk1Button")
        .classList.remove("active");


    document
        .getElementById("hsk2Button")
        .classList.remove("active");


    document
        .getElementById("hsk3Button")
        .classList.remove("active");


    document
        .getElementById(
            "hsk" + level + "Button"
        )
        .classList.add("active");


    shuffle(
        hskData[level]
    );


    loadQuestion();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    const data =
        hskData[currentHSK];


    const input =
        document.getElementById(
            "answerInput"
        );


    const result =
        document.getElementById(
            "result"
        );


    const pinyin =
        document.getElementById(
            "pinyin"
        );


    const hint =
        document.getElementById(
            "hint"
        );


    wrongAttempts = 0;

    answerShown = false;

    questionCompleted = false;


    input.value = "";


    input.classList.remove(
        "input-correct",
        "input-wrong"
    );


    result.innerHTML = "";

    result.className =
        "result";


    pinyin.innerHTML = "";


    hint.innerHTML =
        "Sai 3 lần sẽ hiện đáp án.";


    if (
        !data ||
        data.length === 0
    ) {

        document
            .getElementById(
                "question"
            )
            .textContent =
            "Không có dữ liệu HSK " +
            currentHSK;

        return;

    }


    const item =
        data[
            currentIndex %
            data.length
        ];


    /*
       Cấu trúc dữ liệu:

       [0] = Hán tự
       [1] = Pinyin
       [2] = Nghĩa tiếng Việt
    */

    currentQuestion = {

        question:
            item[2],

        answer:
            item[0],

        pinyin:
            item[1]

    };


    document
        .getElementById(
            "modeTitle"
        )
        .textContent =
        "HSK " +
        currentHSK +
        " • LUYỆN VIẾT";


    document
        .getElementById(
            "question"
        )
        .textContent =
        currentQuestion.question;


    updateProgress();


    setTimeout(function() {

        input.focus();

    },50);

}


/* =====================================================
   CHUẨN HÓA CÂU TRẢ LỜI
===================================================== */

function normalizeText(text) {

    return String(text)

        .trim()

        .replace(/\s+/g,"")

        .replace(
            /[，。！？、,.!?;；:：'"“”‘’`]/g,
            ""
        );

}


/* =====================================================
   KIỂM TRA ĐÁP ÁN
===================================================== */

function checkAnswer() {

    if (!currentQuestion) {
        return;
    }


    if (questionCompleted) {
        return;
    }


    const input =
        document.getElementById(
            "answerInput"
        );


    const userAnswer =
        normalizeText(
            input.value
        );


    if (!userAnswer) {
        return;
    }


    const correctAnswer =
        normalizeText(
            currentQuestion.answer
        );


    /* =================================================
       ĐÚNG
    ================================================= */

    if (
        userAnswer ===
        correctAnswer
    ) {

        questionCompleted = true;


        correctCount++;

        doneCount++;


        input.classList.remove(
            "input-wrong"
        );


        input.classList.add(
            "input-correct"
        );


        const result =
            document.getElementById(
                "result"
            );


        result.className =
            "result correct";


        result.innerHTML =

            '<div class="answer">' +
            escapeHTML(
                currentQuestion.answer
            ) +
            '</div>' +

            '<div class="answer-pinyin">' +
            escapeHTML(
                currentQuestion.pinyin
            ) +
            '</div>';


        saveLastQuestion();


        updateStats();


        /*
           Sau 1,5 giây sang từ tiếp theo.
        */

        nextTimer =
            setTimeout(function() {

                currentIndex++;

                loadQuestion();

            },1500);


        return;

    }


    /* =================================================
       SAI
    ================================================= */

    /*
       Sau khi đã hiện đáp án ở lần 3,
       nhập sai tiếp không tăng số lần sai nữa.
    */

    if (!answerShown) {

        wrongAttempts++;

        wrongCount++;

    }


    input.classList.remove(
        "input-correct"
    );


    input.classList.add(
        "input-wrong"
    );


    updateStats();


    /* =================================================
       SAI LẦN 2
    ================================================= */

    if (
        wrongAttempts === 2
    ) {

        showPinyinInitials();

    }


    /* =================================================
       SAI LẦN 3
    ================================================= */

    if (
        wrongAttempts >= 3 &&
        !answerShown
    ) {

        answerShown = true;


        showAnswerAfterThreeWrong();

    }

}


/* =====================================================
   GỢI Ý CHỮ ĐẦU PINYIN
===================================================== */

function showPinyinInitials() {

    const hint =
        document.getElementById(
            "hint"
        );


    const pinyin =
        String(
            currentQuestion.pinyin
        ).trim();


    const initials =
        pinyin

            .split(/\s+/)

            .map(function(word) {

                return word
                    ? word.charAt(0)
                    : "";

            })

            .join("");


    hint.innerHTML =
        "Gợi ý Pinyin: " +
        escapeHTML(
            initials
        );

}


/* =====================================================
   HIỆN ĐÁP ÁN SAU 3 LẦN SAI
===================================================== */

function showAnswerAfterThreeWrong() {

    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result wrong";


    result.innerHTML =

        '<div class="answer">' +
        escapeHTML(
            currentQuestion.answer
        ) +
        '</div>' +

        '<div class="answer-pinyin">' +
        escapeHTML(
            currentQuestion.pinyin
        ) +
        '</div>';


    document
        .getElementById(
            "hint"
        )
        .innerHTML =
        "Hãy gõ lại đúng đáp án để tiếp tục.";

}


/* =====================================================
   LƯU CÂU VỪA LÀM
===================================================== */

function saveLastQuestion() {

    lastQuestion = {

        question:
            currentQuestion.question,

        answer:
            currentQuestion.answer,

        pinyin:
            currentQuestion.pinyin

    };


    hasPreviousQuestion = true;

}


/* =====================================================
   XEM CÂU VỪA LÀM
===================================================== */

function showPreviousQuestion() {

    if (
        !hasPreviousQuestion ||
        !lastQuestion
    ) {

        document
            .getElementById(
                "hint"
            )
            .innerHTML =
            "Chưa có câu vừa làm.";

        return;

    }


    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }


    currentQuestion = {

        question:
            lastQuestion.question,

        answer:
            lastQuestion.answer,

        pinyin:
            lastQuestion.pinyin

    };


    questionCompleted = true;


    answerShown = true;


    document
        .getElementById(
            "question"
        )
        .textContent =
        lastQuestion.question;


    const input =
        document.getElementById(
            "answerInput"
        );


    input.value = "";


    input.classList.remove(
        "input-wrong"
    );


    input.classList.add(
        "input-correct"
    );


    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result correct";


    result.innerHTML =

        '<div class="answer">' +
        escapeHTML(
            lastQuestion.answer
        ) +
        '</div>' +

        '<div class="answer-pinyin">' +
        escapeHTML(
            lastQuestion.pinyin
        ) +
        '</div>';


    document
        .getElementById(
            "hint"
        )
        .innerHTML =
        "Đây là câu vừa làm.";

}


/* =====================================================
   XÁO TRỘN HSK HIỆN TẠI
===================================================== */

function shuffleCurrentLevel() {

    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }


    shuffle(
        hskData[currentHSK]
    );


    currentIndex = 0;


    loadQuestion();

}


/* =====================================================
   THỐNG KÊ
===================================================== */

function updateStats() {

    document
        .getElementById(
            "correctCount"
        )
        .textContent =
        correctCount;


    document
        .getElementById(
            "wrongCount"
        )
        .textContent =
        wrongCount;


    document
        .getElementById(
            "doneCount"
        )
        .textContent =
        doneCount;


    let accuracy = 0;


    if (doneCount > 0) {

        accuracy =
            Math.round(
                (
                    correctCount /
                    doneCount
                ) * 100
            );

    }


    document
        .getElementById(
            "accuracy"
        )
        .textContent =
        accuracy + "%";

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    const data =
        hskData[currentHSK];


    if (
        !data ||
        data.length === 0
    ) {

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            "0%";

        return;

    }


    const position =
        currentIndex %
        data.length;


    const percent =
        (
            (position + 1) /
            data.length
        ) * 100;


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percent + "%";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ENTER = KIỂM TRA
===================================================== */

document
    .getElementById(
        "answerInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                checkAnswer();

            }

        }
    );


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

shuffle(
    hskData[1]
);

shuffle(
    hskData[2]
);

shuffle(
    hskData[3]
);


loadQuestion();

</script>

</body>
</html>
