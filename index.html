<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MYVZQDTS96"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-MYVZQDTS96');
</script>
<title>TIẾNG TRUNG LEEBACC</title>
<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>
<script src="cauhsk3.js"></script>
<script src="epnhua.js"></script>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f4f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:#222
}
.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px
}
.header{
    background:linear-gradient(135deg,#1677ff,#005bea);
    color:white;
    border-radius:18px;
    padding:20px 12px;
    text-align:center;
    margin-bottom:8px;
    box-shadow:0 5px 15px rgba(0,0,0,.08)
}
.header h1{
    margin:0;
    font-size:24px
}
.header p{
    margin:6px 0 0;
    font-size:13px
}
.user-area{
    background:white;
    border-radius:14px;
    padding:12px;
    margin-bottom:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    text-align:center
}
.user-greeting{
    font-size:15px;
    font-weight:600;
    margin-bottom:5px
}
.user-progress{
    font-size:13px;
    color:#555;
    margin-bottom:10px
}
.user-actions{
    display:grid;
    grid-template-columns:1fr;
    gap:7px
}
.user-actions button{
    border:none;
    border-radius:11px;
    padding:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer
}
.continue-button{
    background:#1677ff;
    color:white
}
.change-user-button{
    background:#f1f3f5;
    color:#444
}
.name-screen{
    position:fixed;
    inset:0;
    background:#f4f6f8;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px
}
.name-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
    text-align:center
}
.name-box h2{
    margin:0;
    font-size:22px;
    color:#1677ff
}
.name-box p{
    color:#666;
    font-size:14px;
    margin:8px 0 18px
}
.start-button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:13px;
    background:#1677ff;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer
}
.main-menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px
}
.main-menu button{
    min-height:85px;
    border:none;
    background:white;
    border-radius:16px;
    padding:12px 8px;
    font-size:16px;
    font-weight:700;
    color:#333;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.06)
}
.main-menu button:active{
    transform:scale(.98)
}
.main-menu .hsk1{
    color:#1677ff
}
.main-menu .hsk2{
    color:#16a34a
}
.main-menu .hsk3{
    color:#9333ea
}
.main-menu .sentence{
    color:#ea580c
}
.main-menu .epnhua{
    color:#0d9488
}
.course-screen{
    background:white;
    border-radius:18px;
    padding:22px 16px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.07)
}
.course-icon{
    font-size:42px;
    margin-bottom:5px
}
.course-title{
    font-size:22px;
    font-weight:800;
    color:#1677ff;
    margin-bottom:8px
}
.course-description{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:18px
}
.course-start{
    width:100%;
    border:none;
    border-radius:12px;
    padding:13px;
    background:#1677ff;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:8px
}
.course-back{
    width:100%;
    border:none;
    border-radius:12px;
    padding:11px;
    background:#f1f3f5;
    color:#444;
    font-size:14px;
    font-weight:600;
    cursor:pointer
}
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-bottom:7px
}
.stat{
    background:white;
    border-radius:8px;
    padding:6px 3px;
    text-align:center;
    box-shadow:0 1px 4px rgba(0,0,0,.04)
}
.stat-number{
    font-size:13px;
    line-height:15px;
    font-weight:700
}
.stat-label{
    font-size:8px;
    line-height:10px;
    color:#777;
    margin-top:2px
}
.progress{
    height:5px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:8px
}
.progress-fill{
    height:100%;
    width:0%;
    background:#1677ff;
    transition:width .25s
}
.card{
    position:relative;
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.07)
}
.back-to-menu{
    position:absolute;
    top:8px;
    left:8px;
    width:32px;
    height:32px;
    padding:0;
    border:none;
    border-radius:8px;
    background:#e5e7eb;
    color:#555;
    font-size:20px;
    font-weight:700;
    line-height:32px;
    text-align:center;
    cursor:pointer;
    z-index:2
}
.mode-title{
    text-align:center;
    font-size:14px;
    color:#1677ff;
    font-weight:700;
    margin-bottom:16px
}
.question{
    text-align:center;
    font-size:25px;
    font-weight:700;
    min-height:48px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:15px
}
input{
    width:100%;
    padding:13px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:20px;
    text-align:center;
    outline:none;
    background:white
}
input:focus{
    border-color:#1677ff
}
.input-correct{
    border-color:#22c55e!important;
    background:#f0fdf4!important;
    color:#15803d!important
}
.input-wrong{
    border-color:#ef4444!important;
    background:#fef2f2!important;
    color:#dc2626!important
}
.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:10px
}
.actions button{
    border:none;
    border-radius:11px;
    padding:11px 7px;
    background:#1677ff;
    color:white;
    font-size:13px;
    font-weight:600;
    cursor:pointer
}
.result{
    margin-top:10px;
    text-align:center;
    min-height:0
}
.result.correct{
    color:#16a34a
}
.result.wrong{
    color:#dc2626
}
.answer{
    margin-top:5px;
    font-size:21px;
    font-weight:700;
    color:#222
}
.answer-pinyin{
    margin-top:3px;
    color:#1677ff;
    font-size:17px;
    font-weight:600
}
.info{
    text-align:center;
    color:#888;
    font-size:11px;
    margin-top:10px;
    min-height:16px
}
.hidden{
    display:none!important
}
@media(max-width:430px){
    .container{
        padding:7px
    }
    .header{
        padding:16px 8px;
        border-radius:15px
    }
    .header h1{
        font-size:21px
    }
    .header p{
        font-size:12px
    }
    .main-menu button{
        min-height:78px;
        font-size:14px
    }
    .card{
        padding:15px
    }
    .question{
        font-size:22px
    }
    input{
        font-size:18px
    }
}
</style>
</head>
<body>
<div id="nameScreen" class="name-screen hidden">
<div class="name-box">
    <h2>🇨🇳 TIẾNG TRUNG LEEBACC</h2>
    <p>
        Nhập tên để lưu tiến độ học của bạn
    </p>
    <input
        id="nameInput"
        type="text"
        autocomplete="name"
        placeholder="Nhập tên của bạn..."
    >
    <button
        class="start-button"
        onclick="startLearning()"
    >
        ▶ Bắt đầu học
    </button>
</div>
</div>
<div class="container">
<div class="header">
    <h1>🇨🇳 TIẾNG TRUNG LEEBACC</h1>
    <p id="headerUserName">
        Luyện tiếng Trung
    </p>
</div>
<div id="userArea" class="user-area hidden">
    <div
        id="userGreeting"
        class="user-greeting"
    ></div>
    <div
        id="userProgress"
        class="user-progress"
    ></div>
    <div class="user-actions">
        <button
            class="continue-button"
            onclick="continueLearning()"
        >
            ▶ Tiếp tục học
        </button>
        <button
            class="change-user-button"
            onclick="changeUser()"
        >
            👤 Đổi người học
        </button>
    </div>
</div>
<div id="selectionArea" class="hidden">
    <div class="main-menu">
        <button
            class="hsk1"
            onclick="openCourse(1)"
        >
            📘<br>HSK 1
        </button>
        <button
            class="hsk2"
            onclick="openCourse(2)"
        >
            📗<br>HSK 2
        </button>
        <button
            class="hsk3"
            onclick="openCourse(3)"
        >
            📕<br>HSK 3
        </button>
        <button
            class="sentence"
            onclick="openCourse(4)"
        >
            ✍️<br>LUYỆN CÂU
        </button>
        <button
            class="epnhua"
            onclick="openCourse(5)"
        >
            🏭<br>ÉP NHỰA
        </button>
    </div>
</div>
<div id="courseArea" class="hidden">
    <div class="course-screen">
        <div
            id="courseIcon"
            class="course-icon"
        >
            📘
        </div>
        <div
            id="courseTitle"
            class="course-title"
        >
            HSK 1
        </div>
        <div
            id="courseDescription"
            class="course-description"
        >
            Luyện viết chữ Hán HSK1.
        </div>
        <button
            class="course-start"
            onclick="startSelectedCourse()"
        >
            ▶ BẮT ĐẦU
        </button>
        <button
            class="course-back"
            onclick="backToSelection()"
        >
            ← Chọn nội dung khác
        </button>
    </div>
</div>
<div id="learningArea" class="hidden">
    <div class="stats">
        <div class="stat">
            <div
                id="correctCount"
                class="stat-number"
            >
                0
            </div>
            <div class="stat-label">
                Đúng
            </div>
        </div>
        <div class="stat">
            <div
                id="wrongCount"
                class="stat-number"
            >
                0
            </div>
            <div class="stat-label">
                Sai
            </div>
        </div>
        <div class="stat">
            <div
                id="doneCount"
                class="stat-number"
            >
                0
            </div>
            <div class="stat-label">
                Đã làm
            </div>
        </div>
        <div class="stat">
            <div
                id="accuracy"
                class="stat-number"
            >
                0%
            </div>
            <div class="stat-label">
                Tỷ lệ
            </div>
        </div>
    </div>
    <div class="progress">
        <div
            id="progressFill"
            class="progress-fill"
        ></div>
    </div>
    <div class="card">
        <button
            class="back-to-menu"
            onclick="exitLearning()"
            title="Quay lại"
        >
            ←
        </button>
        <div
            id="modeTitle"
            class="mode-title"
        >
            HSK 1 • LUYỆN VIẾT
        </div>
        <div
            id="question"
            class="question"
        >
            Đang tải...
        </div>
        <input
            id="answerInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Nhập chữ Hán..."
        >
        <div class="actions">
            <button
                onclick="showPreviousQuestion()"
            >
                ← Câu vừa làm
            </button>
            <button
                onclick="shuffleCurrentLevel()"
            >
                🔀 Xáo trộn
            </button>
        </div>
        <div
            id="result"
            class="result"
        ></div>
        <div
            id="hint"
            class="info"
        >
            Sai 3 lần sẽ hiện đáp án.
        </div>
    </div>
</div>
</div>
<!-- APP CHÍNH: phải chạy sau khi HTML đã tải xong -->
<script src="app.js"></script>
</body>
</html>
