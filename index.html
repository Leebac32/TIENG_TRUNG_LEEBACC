<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TIẾNG TRUNG LEEBACC</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    background: #f3f4f6;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}
button,
input {
    font-family: inherit;
}
.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    background: white;
}
/* =========================
   HEADER
========================= */
.header {
    background: #c62828;
    color: white;
    text-align: center;
    padding: 18px 12px;
}
.header h1 {
    margin: 0;
    font-size: 22px;
}
.header p {
    margin: 5px 0 0;
    font-size: 13px;
}
/* =========================
   SCREEN
========================= */
.screen {
    display: none;
    padding: 22px 18px;
}
.screen.active {
    display: block;
}
/* =========================
   LEVEL
========================= */
.level-title {
    text-align: center;
    margin-bottom: 25px;
}
.level-title h2 {
    margin-bottom: 8px;
}
.level-title p {
    color: #777;
}
.level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}
.level-card {
    background: white;
    border: 2px solid #ddd;
    border-radius: 14px;
    padding: 20px 5px;
    font-size: 15px;
    font-weight: bold;
}
.level-card:active {
    transform: scale(.97);
}
.level-card strong {
    display: block;
    color: #c62828;
    font-size: 24px;
    margin-bottom: 8px;
}
/* =========================
   BUTTON
========================= */
.btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: bold;
}
.primary {
    background: #c62828;
    color: white;
}
.secondary {
    background: #eeeeee;
    color: #333;
}
.help {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffe08a;
}
/* =========================
   STUDY
========================= */
.study {
    text-align: center;
}
.counter {
    font-size: 13px;
    color: #888;
    margin-bottom: 18px;
}
.progress {
    height: 7px;
    background: #eeeeee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 30px;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: #c62828;
    transition: width .2s;
}
/* =========================
   MEANING
========================= */
.meaning {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    font-size: 30px;
    font-weight: bold;
    text-align: center;
}
/* =========================
   HINT
========================= */
.hint {
    color: #888;
    font-size: 14px;
    margin: 8px 0 18px;
}
/* =========================
   INPUT
========================= */
.answer-input {
    width: 100%;
    padding: 16px;
    border: 2px solid #dddddd;
    border-radius: 12px;
    outline: none;
    font-size: 25px;
    text-align: center;
}
.answer-input:focus {
    border-color: #c62828;
}
/* =========================
   RESULT
========================= */
.result {
    min-height: 30px;
    margin-top: 14px;
    font-size: 17px;
    font-weight: bold;
}
.result.correct {
    color: #2e7d32;
}
.result.wrong {
    color: #c62828;
}
/* =========================
   HELP DISPLAY
========================= */
.help-box {
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    background: #fff8e1;
    color: #795548;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    display: none;
}
.help-box.show {
    display: block;
}
/* =========================
   SOLUTION
========================= */
.solution {
    margin-top: 12px;
    padding: 15px;
    border-radius: 12px;
    background: #fff3f3;
    font-size: 22px;
    line-height: 1.5;
    display: none;
}
.solution b {
    color: #c62828;
}
/* =========================
   NOTE
========================= */
.note {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #999;
    line-height: 1.5;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 380px) {
    .level-grid {
        grid-template-columns: 1fr;
    }
    .meaning {
        font-size: 26px;
    }
}
</style>
</head>
<body>
<div class="app">
<!-- =========================
     HEADER
========================= -->
<div class="header">
<h1>TIẾNG TRUNG LEEBACC</h1>
<p>
    HSK · Luyện Nghĩa → Chữ Hán
</p>
</div>
<!-- =========================
     LEVEL SCREEN
========================= -->
<section
    id="levelScreen"
    class="screen active"
>
<div class="level-title">
    <h2>
        Chọn cấp độ HSK
    </h2>
    <p>
        Chọn cấp độ để bắt đầu
    </p>
</div>
<div class="level-grid">
    <button
        class="level-card"
        onclick="startLevel(1)"
    >
        <strong>
            HSK 1
        </strong>
        300 từ
    </button>
    <button
        class="level-card"
        onclick="startLevel(2)"
    >
        <strong>
            HSK 2
        </strong>
        500 từ
    </button>
    <button
        class="level-card"
        onclick="startLevel(3)"
    >
        <strong>
            HSK 3
        </strong>
        1000 từ
    </button>
</div>
</section>
<!-- =========================
     STUDY SCREEN
========================= -->
<section
    id="studyScreen"
    class="screen study"
>
<div class="counter">
    HSK
    <span id="levelText">
        1
    </span>
    ·
    <span id="countText">
        0 / 300
    </span>
</div>
<div class="progress">
    <div
        id="progressBar"
        class="progress-bar"
    ></div>
</div>
<!-- NGHĨA TIẾNG VIỆT -->
<div
    id="meaning"
    class="meaning"
>
    ...
</div>
<div class="hint">
    Nhập chữ Hán của từ trên
</div>
<!-- Ô NHẬP CHỮ HÁN -->
<input
    id="answerInput"
    class="answer-input"
    type="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    placeholder="输入汉字"
>
<!-- NÚT HỖ TRỢ -->
<button
    id="helpButton"
    class="btn help"
    onclick="showHelp()"
>
    💡 Hỗ trợ
</button>
<!-- GỢI Ý PINYIN -->
<div
    id="helpBox"
    class="help-box"
></div>
<!-- KẾT QUẢ -->
<div
    id="result"
    class="result"
></div>
<!-- ĐÁP ÁN SAU 3 LẦN SAI -->
<div
    id="solution"
    class="solution"
></div>
<!-- QUAY LẠI -->
<button
    class="btn secondary"
    onclick="backToLevel()"
>
    ← Đổi HSK
</button>
<div class="note">
    Sai 3 lần sẽ hiện đáp án.<br>
    Sau khi hiện đáp án,
    bạn phải nhập lại đúng
    mới được sang từ tiếp theo.
</div>
</section>
</div>
<!-- =========================
     DATA
========================= -->
<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>
<script>
/* =========================================================
   BIẾN
========================================================= */
let currentLevel = 1;
let currentWords = [];
let randomWords = [];
let currentWord = null;
let wrongCount = 0;
let mustRepeatAnswer = false;
let completedCount = 0;
/* =========================================================
   LẤY DỮ LIỆU HSK
========================================================= */
function getVocabulary(level) {
    let data = [];
    if (
        level >= 1 &&
        Array.isArray(window.HSK1)
    ) {
        data = data.concat(
            window.HSK1
        );
    }
    if (
        level >= 2 &&
        Array.isArray(window.HSK2)
    ) {
        data = data.concat(
            window.HSK2
        );
    }
    if (
        level >= 3 &&
        Array.isArray(window.HSK3)
    ) {
        data = data.concat(
            window.HSK3
        );
    }
    const words = data.map(
        function(item) {
            return {
                hanzi: item[0] || "",
                pinyin: item[1] || "",
                meaning: item[2] || ""
            };
        }
    );
    /*
       Xóa bản ghi trùng hoàn toàn
    */
    const seen = new Set();
    return words.filter(
        function(word) {
            const key =
                word.hanzi +
                "|" +
                word.pinyin +
                "|" +
                word.meaning;
            if (seen.has(key)) {
                return false;
            }
            seen.add(key);
            return true;
        }
    );
}
/* =========================================================
   RANDOM
========================================================= */
function shuffle(array) {
    const copy =
        array.slice();
    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {
        const j =
            Math.floor(
                Math.random() * (i + 1)
            );
        const temp =
            copy[i];
        copy[i] =
            copy[j];
        copy[j] =
            temp;
    }
    return copy;
}
/* =========================================================
   CHUẨN HÓA CHỮ HÁN
========================================================= */
function normalizeHanzi(text) {
    return String(text || "")
        .trim()
        /*
           Chuẩn hóa Unicode
        */
        .normalize("NFC")
        /*
           Xóa khoảng trắng
        */
        .replace(/\s+/g, "");
}
/* =========================================================
   KIỂM TRA CHỮ HÁN
========================================================= */
function isCorrect(input, word) {
    return (
        normalizeHanzi(input) ===
        normalizeHanzi(word.hanzi)
    );
}
/* =========================================================
   TẠO GỢI Ý PINYIN
=========================================================
   Ví dụ:
   xuéxiào
   ↓
   x--- x---
   lǎoshī
   ↓
   l--- s---
   zhōngguó
   ↓
   z----- g-----
   Mỗi âm tiết lấy chữ cái đầu.
========================================================= */
function createPinyinHint(pinyin) {
    let text =
        String(pinyin || "")
        .trim()
        .toLowerCase();
    /*
       Tách các âm tiết Pinyin.
       Trường hợp thông thường:
       xuéxiào
       Với Pinyin có dấu,
       cần tách theo nguyên âm + phụ âm
       để lấy đúng từng âm tiết.
    */
    /*
       Cách an toàn nhất:
       dùng khoảng trắng nếu dữ liệu có sẵn.
       Nếu không có khoảng trắng,
       dùng Hanzi để xác định số âm tiết
       trong createHelpHint().
    */
    const syllables =
        text
        .split(/\s+/)
        .filter(Boolean);
    return syllables.map(
        function(syllable) {
            return (
                syllable.charAt(0) +
                "---"
            );
        }
    ).join(" ");
}
/* =========================================================
   TẠO GỢI Ý DỰA THEO HANZI + PINYIN
========================================================= */
function createHelpHint(word) {
    let pinyin =
        String(word.pinyin || "")
        .trim()
        .toLowerCase();
    /*
       Nếu dữ liệu Pinyin đã có khoảng trắng
       thì xử lý trực tiếp.
    */
    if (
        pinyin.indexOf(" ") !== -1
    ) {
        return createPinyinHint(
            pinyin
        );
    }
    /*
       Tách Pinyin không có khoảng trắng.
       Ví dụ:
       xuéxiào
       lǎoshī
       zhōngguó
       Danh sách phụ âm đầu Pinyin.
    */
    const initials = [
        "zh",
        "ch",
        "sh",
        "b",
        "p",
        "m",
        "f",
        "d",
        "t",
        "n",
        "l",
        "g",
        "k",
        "h",
        "j",
        "q",
        "x",
        "r",
        "z",
        "c",
        "s",
        "y",
        "w"
    ];
    /*
       Dựa vào số chữ Hán
       để chia thành số âm tiết tương ứng.
    */
    const chars =
        Array.from(
            word.hanzi || ""
        );
    const syllableCount =
        chars.length;
    let result = [];
    let position = 0;
    for (
        let i = 0;
        i < syllableCount;
        i++
    ) {
        if (
            position >= pinyin.length
        ) {
            break;
        }
        let initial = "";
        /*
           Kiểm tra phụ âm đầu 2 chữ
        */
        const two =
            pinyin.substring(
                position,
                position + 2
            );
        if (
            initials.indexOf(two) !== -1
        ) {
            initial = two;
            position += 2;
        }
        else {
            const one =
                pinyin.charAt(
                    position
                );
            /*
               Nếu bắt đầu bằng nguyên âm
               thì lấy chính nguyên âm đầu.
            */
            initial = one;
            position += 1;
        }
        /*
           Bỏ phần còn lại của âm tiết.
           Tìm nguyên âm tiếp theo làm mốc.
        */
        let foundEnd = false;
        while (
            position < pinyin.length &&
            !foundEnd
        ) {
            const ch =
                pinyin.charAt(
                    position
                );
            /*
               Khi gặp phụ âm đầu của âm tiết
               kế tiếp thì dừng.
               Vì một số trường hợp khó tách,
               phần gợi ý vẫn ưu tiên chữ cái đầu.
            */
            position++;
            /*
               Không cố đoán dấu thanh.
            */
        }
        result.push(
            initial + "---"
        );
    }
    /*
       Nếu thuật toán trên không tạo đủ
       số âm tiết, dùng số chữ Hán.
    */
    while (
        result.length < syllableCount
    ) {
        result.push(
            "---"
        );
    }
    return result.join(" ");
}
/* =========================================================
   CHỌN HSK
========================================================= */
function startLevel(level) {
    currentLevel =
        level;
    currentWords =
        getVocabulary(level);
    if (!currentWords.length) {
        alert(
            "Chưa có dữ liệu HSK."
        );
        return;
    }
    randomWords =
        shuffle(currentWords);
    currentWord = null;
    wrongCount = 0;
    mustRepeatAnswer = false;
    completedCount = 0;
    localStorage.setItem(
        "leebacc_level",
        String(level)
    );
    document.getElementById(
        "levelText"
    ).textContent =
        level;
    document.getElementById(
        "countText"
    ).textContent =
        "0 / " +
        currentWords.length;
    showScreen(
        "studyScreen"
    );
    nextRandomWord();
}
/* =========================================================
   TỪ RANDOM TIẾP THEO
========================================================= */
function nextRandomWord() {
    if (
        randomWords.length === 0
    ) {
        randomWords =
            shuffle(currentWords);
    }
    currentWord =
        randomWords.pop();
    wrongCount = 0;
    mustRepeatAnswer = false;
    document.getElementById(
        "meaning"
    ).textContent =
        currentWord.meaning;
    const input =
        document.getElementById(
            "answerInput"
        );
    input.value = "";
    input.disabled = false;
    document.getElementById(
        "result"
    ).textContent = "";
    document.getElementById(
        "result"
    ).className =
        "result";
    /*
       Xóa gợi ý
    */
    document.getElementById(
        "helpBox"
    ).textContent = "";
    document.getElementById(
        "helpBox"
    ).classList.remove(
        "show"
    );
    /*
       Hiện lại nút hỗ trợ
    */
    document.getElementById(
        "helpButton"
    ).style.display =
        "block";
    /*
       Ẩn đáp án
    */
    document.getElementById(
        "solution"
    ).style.display =
        "none";
    /*
       Số thứ tự hiện tại
    */
    completedCount++;
    document.getElementById(
        "countText"
    ).textContent =
        completedCount +
        " / " +
        currentWords.length;
    const percent =
        Math.min(
            completedCount,
            currentWords.length
        )
        /
        currentWords.length
        *
        100;
    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";
    setTimeout(
        function() {
            input.focus();
        },
        50
    );
}
/* =========================================================
   NÚT HỖ TRỢ
========================================================= */
function showHelp() {
    if (!currentWord) {
        return;
    }
    const helpBox =
        document.getElementById(
            "helpBox"
        );
    /*
       Nếu đã hiện rồi thì không làm gì.
    */
    if (
        helpBox.classList.contains(
            "show"
        )
    ) {
        return;
    }
    const hint =
        createHelpHint(
            currentWord
        );
    helpBox.textContent =
        hint;
    helpBox.classList.add(
        "show"
    );
}
/* =========================================================
   KIỂM TRA ĐÁP ÁN
========================================================= */
function checkAnswer() {
    if (!currentWord) {
        return;
    }
    const input =
        document.getElementById(
            "answerInput"
        );
    const value =
        input.value.trim();
    if (!value) {
        return;
    }
    /*
       ĐÚNG
    */
    if (
        isCorrect(
            value,
            currentWord
        )
    ) {
        if (mustRepeatAnswer) {
            document.getElementById(
                "result"
            ).textContent =
                "✓ Đúng! Sang từ tiếp theo.";
        }
        else {
            document.getElementById(
                "result"
            ).textContent =
                "✓ Chính xác!";
        }
        document.getElementById(
            "result"
        ).className =
            "result correct";
        setTimeout(
            function() {
                nextRandomWord();
            },
            500
        );
        return;
    }
    /*
       SAI
    */
    wrongCount++;
    document.getElementById(
        "result"
    ).textContent =
        "✗ Sai lần " +
        wrongCount +
        "/3";
    document.getElementById(
        "result"
    ).className =
        "result wrong";
    /*
       SAI 3 LẦN
    */
    if (
        wrongCount >= 3
    ) {
        mustRepeatAnswer = true;
        /*
           Hiện đáp án đầy đủ
        */
        document.getElementById(
            "solution"
        ).innerHTML =
            "Đáp án: <b>" +
            escapeHTML(
                currentWord.hanzi
            ) +
            "</b><br>" +
            escapeHTML(
                currentWord.pinyin
            );
        document.getElementById(
            "solution"
        ).style.display =
            "block";
        document.getElementById(
            "result"
        ).textContent =
            "Đã sai 3 lần. Hãy nhập lại chữ Hán đúng.";
        /*
           Sau khi hiện đáp án,
           vẫn cho nhập.
        */
        input.value = "";
        input.focus();
    }
}
/* =========================================================
   ENTER
========================================================= */
document
    .getElementById(
        "answerInput"
    )
    .addEventListener(
        "keydown",
        function(event) {
            if (
                event.key === "Enter"
            ) {
                event.preventDefault();
                checkAnswer();
            }
        }
    );
/* =========================================================
   HIỂN THỊ SCREEN
========================================================= */
function showScreen(id) {
    document
        .querySelectorAll(".screen")
        .forEach(
            function(screen) {
                screen.classList.remove(
                    "active"
                );
            }
        );
    const target =
        document.getElementById(id);
    if (target) {
        target.classList.add(
            "active"
        );
    }
    window.scrollTo(
        0,
        0
    );
}
/* =========================================================
   QUAY LẠI
========================================================= */
function backToLevel() {
    showScreen(
        "levelScreen"
    );
}
/* =========================================================
   ESCAPE HTML
========================================================= */
function escapeHTML(text) {
    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
/* =========================================================
   DEBUG
========================================================= */
console.log(
    "HSK1:",
    Array.isArray(window.HSK1)
        ? window.HSK1.length
        : "Không tìm thấy"
);
console.log(
    "HSK2:",
    Array.isArray(window.HSK2)
        ? window.HSK2.length
        : "Không tìm thấy"
);
console.log(
    "HSK3:",
    Array.isArray(window.HSK3)
        ? window.HSK3.length
        : "Không tìm thấy"
);
</script>
</body>
</html>
