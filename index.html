<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIẾNG TRUNG LEEBACC</title>

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #222;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 10px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    background: linear-gradient(135deg,#1677ff,#005bea);
    color: white;
    border-radius: 18px;
    padding: 20px 12px;
    text-align: center;
    margin-bottom: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 6px 0 0;
    font-size: 13px;
    opacity: 0.95;
}


/* =====================================================
   USER AREA
===================================================== */

.user-area {
    background: white;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    text-align: center;
}

.user-greeting {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 5px;
}

.user-progress {
    font-size: 13px;
    color: #555;
    margin-bottom: 10px;
}

.user-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
}

.user-actions button {
    border: none;
    border-radius: 11px;
    padding: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.continue-button {
    background: #1677ff;
    color: white;
}

.change-user-button {
    background: #f1f3f5;
    color: #444;
}


/* =====================================================
   NAME SCREEN
===================================================== */

.name-screen {
    position: fixed;
    inset: 0;
    background: #f4f6f8;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.name-box {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 20px;
    padding: 25px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    text-align: center;
}

.name-box h2 {
    margin: 0;
    font-size: 22px;
    color: #1677ff;
}

.name-box p {
    color: #666;
    font-size: 14px;
    margin: 8px 0 18px;
}

.name-box input {
    margin-bottom: 10px;
}

.start-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 13px;
    background: #1677ff;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}


/* =====================================================
   HSK MENU
===================================================== */

.menu {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 6px;
    margin-bottom: 7px;
}

.menu button {
    border: none;
    background: white;
    border-radius: 10px;
    padding: 8px 4px;
    font-size: 14px;
    font-weight: 700;
    color: #444;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,0.05);
}

.menu button.active {
    background: #1677ff;
    color: white;
}


/* =====================================================
   STATS
===================================================== */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 5px;
    margin-bottom: 7px;
}

.stat {
    background: white;
    border-radius: 8px;
    padding: 6px 3px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.stat-number {
    font-size: 13px;
    line-height: 15px;
    font-weight: 700;
}

.stat-label {
    font-size: 8px;
    line-height: 10px;
    color: #777;
    margin-top: 2px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {
    height: 5px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #1677ff;
    transition: width 0.25s;
}


/* =====================================================
   CARD
===================================================== */

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.07);
}

.mode-title {
    text-align: center;
    font-size: 14px;
    color: #1677ff;
    font-weight: 700;
    margin-bottom: 16px;
}


/* =====================================================
   QUESTION
===================================================== */

.question {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    min-height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
}

.question.vi {
    font-size: 25px;
    color: #333;
}


/* =====================================================
   PINYIN
===================================================== */

.pinyin {
    text-align: center;
    font-size: 19px;
    color: #1677ff;
    font-weight: 600;
    min-height: 25px;
    margin-bottom: 8px;
}


/* =====================================================
   INPUT
===================================================== */

input {
    width: 100%;
    padding: 13px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 20px;
    text-align: center;
    outline: none;
    transition: 0.2s;
    background: white;
}

input:focus {
    border-color: #1677ff;
}

.input-correct {
    border-color: #22c55e !important;
    background: #f0fdf4 !important;
    color: #15803d !important;
}

.input-wrong {
    border-color: #ef4444 !important;
    background: #fef2f2 !important;
    color: #dc2626 !important;
}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 10px;
}

.actions button {
    border: none;
    border-radius: 11px;
    padding: 11px 7px;
    background: #1677ff;
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.actions button:active {
    transform: scale(0.98);
}


/* =====================================================
   RESULT
===================================================== */

.result {
    margin-top: 10px;
    text-align: center;
    min-height: 0;
}

.result.correct {
    color: #16a34a;
}

.result.wrong {
    color: #dc2626;
}

.answer {
    margin-top: 5px;
    font-size: 21px;
    font-weight: 700;
    color: #222;
}

.answer-pinyin {
    margin-top: 3px;
    color: #1677ff;
    font-size: 17px;
    font-weight: 600;
}


/* =====================================================
   HINT
===================================================== */

.info {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 10px;
    min-height: 16px;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:430px) {

    .container {
        padding: 7px;
    }

    .header {
        padding: 16px 8px;
        border-radius: 15px;
    }

    .header h1 {
        font-size: 21px;
    }

    .header p {
        font-size: 12px;
    }

    .menu button {
        font-size: 13px;
        padding: 8px 3px;
    }

    .card {
        padding: 15px;
    }

    .question.vi {
        font-size: 22px;
    }

    input {
        font-size: 18px;
    }

}

</style>
</head>

<body>


<!-- =====================================================
     NHẬP TÊN
===================================================== -->

<div id="nameScreen" class="name-screen hidden">

    <div class="name-box">

        <h2>🇨🇳 TIẾNG TRUNG LEEBACC</h2>

        <p>

        </p>

        <input

        >

        >
            ▶ Bắt đầu học
        </button>

</div>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>
        🇨🇳 TIẾNG TRUNG LEEBACC
    </h1>

    <p id="headerUserName">
        Luyện viết chữ Hán
    </p>

</div>


<!-- =====================================================
     TIẾP TỤC
===================================================== -->

<div id="userArea" class="user-area hidden">

    <div
        id="userGreeting"
        class="user-greeting"
    ></div>

    <div
        id="userProgress"
        class="user-progress"
    ></div>

    <div class="user-actions">

        <button
            class="continue-button"
            onclick="continueLearning()"
        >
            ▶ Tiếp tục học
        </button>

        </button>

    </div>

</div>


<!-- =====================================================

===================================================== -->

<div id="learningArea" class="hidden">


<!-- =====================================================
     HSK
===================================================== -->

<div class="menu">

    <button
        id="hsk1Button"
        class="active"
        onclick="selectHSK(1)"
    >
        HSK 1
    </button>

    <button
        id="hsk3Button"
        onclick="selectHSK(3)"
    >
        HSK 3
    </button>

</div>


<!-- =====================================================
     STATS
===================================================== -->

<div class="stats">

    <div class="stat">
        <div id="correctCount" class="stat-number">0</div>
        <div class="stat-label">Đúng</div>
    </div>

    <div class="stat">
        <div id="wrongCount" class="stat-number">0</div>

    </div>

</div>


<!-- =====================================================
     PROGRESS
===================================================== -->

<div class="progress">

    <div

        class="progress-fill"
    ></div>

</div>


<!-- =====================================================
     CARD
===================================================== -->

<div class="card">

    <div
        id="modeTitle"
        class="mode-title"
    >
        HSK 1 • LUYỆN VIẾT
    </div>

    <div
        id="question"

    >
        Đang tải...
    </div>

    <div
        id="pinyin"

        id="answerInput"
        type="text"

    >

    <div class="actions">

        <button onclick="showPreviousQuestion()">
            ← Câu vừa làm
        </button>

            🔀 Xáo trộn
        </button>

        id="result"
        class="result"

        id="hint"

<script>


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
    "leebacc_hsk_user_v2";


/* =====================================================
   DỮ LIỆU HSK
===================================================== */

const hskData = {

    1: Array.isArray(window.HSK1)
        ? [...window.HSK1]
        : [],

    2: Array.isArray(window.HSK2)
        ? [...window.HSK2]
        : [],

    3: Array.isArray(window.HSK3)
        ? [...window.HSK3]
        : []

};


/* =====================================================
   BIẾN
===================================================== */

let currentUser = null;

let currentHSK = 1;

let currentIndex = 0;

let currentQuestion = null;

let wrongAttempts = 0;

let answerShown = false;

let questionCompleted = false;

let lastQuestion = null;

let hasPreviousQuestion = false;

let nextTimer = null;

let correctCount = 0;

let wrongCount = 0;

let doneCount = 0;


/* =====================================================
   ĐỌC USER
===================================================== */

function getSavedUser() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {
            return null;
        }

        return JSON.parse(saved);

    } catch (error) {

        console.error(
            "Không đọc được dữ liệu:",
            error
        );

        return null;

    }

}


/* =====================================================
   LƯU USER
===================================================== */

function saveUser() {

    if (!currentUser) {
        return;
    }

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(currentUser)
    );

}


/* =====================================================
   TẠO TIẾN ĐỘ
===================================================== */

function createLevelProgress(level) {

    const data =
        hskData[level] || [];

    return {

        order:
            data.map(function(item,index) {
                return index;
            }),

        index: 0,

        correct: 0,

        wrong: 0,

        done: 0

    };

}


/* =====================================================
   ĐẢM BẢO DATA
===================================================== */

function ensureUserData() {

    if (!currentUser) {
        return;
    }

    if (!currentUser.hsk) {
        currentUser.hsk = {};
    }

    [1,2,3].forEach(function(level) {

        if (
            !currentUser.hsk[level] ||
            !Array.isArray(
                currentUser.hsk[level].order
            )
        ) {

            currentUser.hsk[level] =
                createLevelProgress(level);

        }

    });

}


/* =====================================================
   TẠO USER
===================================================== */

function createUser(name) {

    currentUser = {

        name: name,

        lastHSK: 1,

        hsk: {

            1: createLevelProgress(1),

            2: createLevelProgress(2),

            3: createLevelProgress(3)

        }

    };

    saveUser();

}


/* =====================================================
   LẤY TIẾN ĐỘ
===================================================== */

function getLevelProgress(level) {

    ensureUserData();

    return currentUser.hsk[level];

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        const temp =
            array[i];

        array[i] =
            array[j];

        array[j] =
            temp;

    }

}


/* =====================================================
   TẠO ORDER RANDOM
===================================================== */

function createShuffledOrder(level) {

    const data =
        hskData[level] || [];

    const order =
        data.map(function(item,index) {
            return index;
        });

    shuffle(order);

    return order;

}


/* =====================================================
   KIỂM TRA ORDER
===================================================== */

function validOrder(level, order) {

    const data =
        hskData[level] || [];

    if (
        !Array.isArray(order) ||
        order.length !== data.length
    ) {

        return false;

    }

    for (
        let i = 0;
        i < order.length;
        i++
    ) {

        if (
            typeof order[i] !== "number" ||
            order[i] < 0 ||
            order[i] >= data.length
        ) {

            return false;

        }

    }

    return true;

}


/* =====================================================
   MÀN HÌNH NHẬP TÊN
===================================================== */

function showNameScreen() {

    document
        .getElementById("nameScreen")
        .classList.remove("hidden");

    document
        .getElementById("learningArea")
        .classList.add("hidden");

    document
        .getElementById("userArea")
        .classList.add("hidden");

    document
        .getElementById("headerUserName")
        .textContent =
        "Luyện viết chữ Hán";

    setTimeout(function() {

        document
            .getElementById("nameInput")
            .focus();

    },100);

}


/* =====================================================
   BẮT ĐẦU HỌC
===================================================== */

function startLearning() {

    const input =
        document.getElementById(
            "nameInput"
        );

    const name =
        input.value.trim();

    if (!name) {

        input.focus();

        return;

    }

    createUser(name);

    document
        .getElementById("nameScreen")
        .classList.add("hidden");

    enterLearning();

}


/* =====================================================
   MÀN HÌNH TIẾP TỤC
===================================================== */

function showContinueScreen() {

    if (!currentUser) {

        showNameScreen();

        return;

    }

    ensureUserData();

    const level =
        currentUser.lastHSK || 1;

    const progress =
        getLevelProgress(level);

    const total =
        hskData[level].length;

    document
        .getElementById("userGreeting")
        .textContent =
        "👤 Xin chào, " +
        currentUser.name;

    document
        .getElementById("userProgress")
        .textContent =
        "HSK " +
        level +
        " — Đã học " +
        progress.done +
        "/" +
        total +
        " câu";

    document
        .getElementById("userArea")
        .classList.remove("hidden");

    document
        .getElementById("learningArea")
        .classList.add("hidden");

    document
        .getElementById("headerUserName")
        .textContent =
        "Luyện viết chữ Hán";

}


/* =====================================================
   TIẾP TỤC HỌC
===================================================== */

function continueLearning() {

    if (!currentUser) {

        showNameScreen();

        return;

    }

    enterLearning();

}


/* =====================================================
   ĐỔI NGƯỜI HỌC
===================================================== */

function changeUser() {

    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }

    document
        .getElementById("nameInput")
        .value = "";

    showNameScreen();

}


/* =====================================================
   VÀO HỌC
   MỖI LẦN VÀO WEB / TIẾP TỤC
   RANDOM LẠI 1 LẦN
===================================================== */

function enterLearning() {

    if (!currentUser) {
        return;
    }

    ensureUserData();

    document
        .getElementById("nameScreen")
        .classList.add("hidden");

    document
        .getElementById("userArea")
        .classList.add("hidden");

    document
        .getElementById("learningArea")
        .classList.remove("hidden");

    document
        .getElementById("headerUserName")
        .textContent =
        "👤 " +
        currentUser.name;


    /*
       XÁC ĐỊNH HSK CUỐI CÙNG
    */

    let level =
        Number(
            currentUser.lastHSK
        );

    if (
        level !== 1 &&
        level !== 2 &&
        level !== 3
    ) {

        level = 1;

    }


    /*
       RANDOM MỘT LẦN CHO PHIÊN MỚI
    */

    const progress =
        getLevelProgress(level);

    progress.order =
        createShuffledOrder(level);

    progress.index = 0;


    currentHSK = level;

    currentIndex = 0;

    saveUser();


    /*
       LOAD HSK
       selectHSK sẽ KHÔNG random lại
    */

    selectHSK(
        level,
        true
    );

}


/* =====================================================
   CHỌN HSK
   KHÔNG RANDOM KHI BẤM NÚT HSK
===================================================== */

function selectHSK(level, fromSaved) {

    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }

    currentHSK = level;

    const progress =
        getLevelProgress(level);


    /*
       Chỉ tạo order nếu chưa có.
       Không random lại khi chuyển HSK.
    */

    if (
        !validOrder(
            level,
            progress.order
        )
    ) {

        progress.order =
            createShuffledOrder(level);

        progress.index = 0;

    }


    /*
       Nếu HSK vừa được chọn trong cùng phiên,
       dùng vị trí đã lưu.
    */

    currentIndex =
        Math.min(
            progress.index || 0,
            Math.max(
                0,
                hskData[level].length - 1
            )
        );


    correctCount =
        progress.correct || 0;

    wrongCount =
        progress.wrong || 0;

    doneCount =
        progress.done || 0;


    currentUser.lastHSK =
        level;

    saveUser();


    document
        .getElementById("hsk1Button")
        .classList.remove("active");

    document
        .getElementById("hsk2Button")
        .classList.remove("active");

    document
        .getElementById("hsk3Button")
        .classList.remove("active");


    document
        .getElementById(
            "hsk" + level + "Button"
        )
        .classList.add("active");


    loadQuestion();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    const data =
        hskData[currentHSK];

    const progress =
        getLevelProgress(currentHSK);

    const input =
        document.getElementById(
            "answerInput"
        );

    const result =
        document.getElementById(
            "result"
        );

    const pinyin =
        document.getElementById(
            "pinyin"
        );

    const hint =
        document.getElementById(
            "hint"
        );


    wrongAttempts = 0;

    answerShown = false;

    questionCompleted = false;


    input.value = "";

    input.classList.remove(
        "input-correct",
        "input-wrong"
    );


    result.innerHTML = "";

    result.className =
        "result";


    pinyin.innerHTML = "";


    hint.innerHTML =
        "Sai 3 lần sẽ hiện đáp án.";


    if (
        !data ||
        data.length === 0
    ) {

        document
            .getElementById("question")
            .textContent =
            "Không có dữ liệu HSK " +
            currentHSK;

        return;

    }


    const orderIndex =
        currentIndex %
        progress.order.length;

    const realIndex =
        progress.order[orderIndex];

    const item =
        data[realIndex];


    currentQuestion = {

        question:
            item[2],

        answer:
            item[0],

        pinyin:
            item[1]

    };


    document
        .getElementById("modeTitle")
        .textContent =
        "HSK " +
        currentHSK +
        " • LUYỆN VIẾT";


    document
        .getElementById("question")
        .textContent =
        currentQuestion.question;


    updateProgress();

    updateStats();


    setTimeout(function() {

        input.focus();

    },50);

}


/* =====================================================
   CHUẨN HÓA
===================================================== */

function normalizeText(text) {

    return String(text)
        .trim()
        .replace(/\s+/g,"")
        .replace(
            /[，。！？、,.!?;；:：'"“”‘’`]/g,
            ""
        );

}


/* =====================================================
   KIỂM TRA
===================================================== */

function checkAnswer() {

    if (!currentQuestion) {
        return;
    }

    if (questionCompleted) {
        return;
    }


    const input =
        document.getElementById(
            "answerInput"
        );

    const userAnswer =
        normalizeText(
            input.value
        );


    if (!userAnswer) {
        return;
    }


    const correctAnswer =
        normalizeText(
            currentQuestion.answer
        );


    /*
       ĐÚNG
    */

    if (
        userAnswer ===
        correctAnswer
    ) {

        questionCompleted = true;

        correctCount++;

        doneCount++;


        input.classList.remove(
            "input-wrong"
        );

        input.classList.add(
            "input-correct"
        );


        const result =
            document.getElementById(
                "result"
            );


        result.className =
            "result correct";


        result.innerHTML =
            '<div class="answer">' +
            escapeHTML(
                currentQuestion.answer
            ) +
            '</div>' +

            '<div class="answer-pinyin">' +
            escapeHTML(
                currentQuestion.pinyin
            ) +
            '</div>';


        saveLastQuestion();

        saveCurrentProgress();

        updateStats();


        nextTimer =
            setTimeout(function() {

                currentIndex++;

                saveCurrentProgress();

                loadQuestion();

            },1500);


        return;

    }


    /*
       SAI
    */

    if (!answerShown) {

        wrongAttempts++;

        wrongCount++;

    }


    input.classList.remove(
        "input-correct"
    );

    input.classList.add(
        "input-wrong"
    );


    saveCurrentProgress();

    updateStats();


    /*
       SAI LẦN 2
    */

    if (
        wrongAttempts === 2
    ) {

        showPinyinInitials();

    }


    /*
       SAI LẦN 3
    */

    if (
        wrongAttempts >= 3 &&
        !answerShown
    ) {

        answerShown = true;

        showAnswerAfterThreeWrong();

    }

}


/* =====================================================
   GỢI Ý PINYIN
===================================================== */

function showPinyinInitials() {

    const hint =
        document.getElementById(
            "hint"
        );

    const pinyin =
        String(
            currentQuestion.pinyin
        ).trim();


    const initials =
        pinyin
            .split(/\s+/)
            .map(function(word) {

                return word
                    ? word.charAt(0)
                    : "";

            })
            .join("");


    hint.innerHTML =
        "Gợi ý Pinyin: " +
        escapeHTML(initials);

}


/* =====================================================
   ĐÁP ÁN SAU 3 LẦN
===================================================== */

function showAnswerAfterThreeWrong() {

    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result wrong";


    result.innerHTML =
        '<div class="answer">' +
        escapeHTML(
            currentQuestion.answer
        ) +
        '</div>' +

        '<div class="answer-pinyin">' +
        escapeHTML(
            currentQuestion.pinyin
        ) +
        '</div>';


    document
        .getElementById("hint")
        .innerHTML =
        "Hãy gõ lại đúng đáp án để tiếp tục.";

}


/* =====================================================
   LƯU CÂU VỪA LÀM
===================================================== */

function saveLastQuestion() {

    lastQuestion = {

        question:
            currentQuestion.question,

        answer:
            currentQuestion.answer,

        pinyin:
            currentQuestion.pinyin

    };

    hasPreviousQuestion = true;

}


/* =====================================================
   CÂU VỪA LÀM
===================================================== */

function showPreviousQuestion() {

    if (
        !hasPreviousQuestion ||
        !lastQuestion
    ) {

        document
            .getElementById("hint")
            .innerHTML =
            "Chưa có câu vừa làm.";

        return;

    }


    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }


    currentQuestion = {

        question:
            lastQuestion.question,

        answer:
            lastQuestion.answer,

        pinyin:
            lastQuestion.pinyin

    };


    questionCompleted = true;

    answerShown = true;


    document
        .getElementById("question")
        .textContent =
        lastQuestion.question;


    const input =
        document.getElementById(
            "answerInput"
        );


    input.value = "";

    input.classList.remove(
        "input-wrong"
    );

    input.classList.add(
        "input-correct"
    );


    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result correct";


    result.innerHTML =
        '<div class="answer">' +
        escapeHTML(
            lastQuestion.answer
        ) +
        '</div>' +

        '<div class="answer-pinyin">' +
        escapeHTML(
            lastQuestion.pinyin
        ) +
        '</div>';


    document
        .getElementById("hint")
        .innerHTML =
        "Đây là câu vừa làm.";

}


/* =====================================================
   XÁO TRỘN THỦ CÔNG
===================================================== */

function shuffleCurrentLevel() {

    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }


    const progress =
        getLevelProgress(
            currentHSK
        );


    progress.order =
        createShuffledOrder(
            currentHSK
        );


    progress.index = 0;

    currentIndex = 0;


    saveUser();

    loadQuestion();

}


/* =====================================================
   LƯU TIẾN ĐỘ
===================================================== */

function saveCurrentProgress() {

    if (!currentUser) {
        return;
    }


    ensureUserData();


    const progress =
        getLevelProgress(
            currentHSK
        );


    progress.index =
        currentIndex;

    progress.correct =
        correctCount;

    progress.wrong =
        wrongCount;

    progress.done =
        doneCount;


    currentUser.lastHSK =
        currentHSK;


    saveUser();

}


/* =====================================================
   THỐNG KÊ
===================================================== */

function updateStats() {

    document
        .getElementById(
            "correctCount"
        )
        .textContent =
        correctCount;


    document
        .getElementById(
            "wrongCount"
        )
        .textContent =
        wrongCount;


    document
        .getElementById(
            "doneCount"
        )
        .textContent =
        doneCount;


    let accuracy = 0;


    if (doneCount > 0) {

        accuracy =
            Math.round(
                (
                    correctCount /
                    doneCount
                ) * 100
            );

    }


    document
        .getElementById(
            "accuracy"
        )
        .textContent =
        accuracy + "%";

}


/* =====================================================
   PROGRESS BAR
===================================================== */

function updateProgress() {

    const data =
        hskData[currentHSK];


    if (
        !data ||
        data.length === 0
    ) {

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            "0%";

        return;

    }


    const position =
        currentIndex %
        data.length;


    const percent =
        (
            (position + 1) /
            data.length
        ) * 100;


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percent + "%";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ENTER = KIỂM TRA
===================================================== */

document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                checkAnswer();

            }

        }
    );


/* =====================================================
   ENTER = BẮT ĐẦU
===================================================== */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                startLearning();

            }

        }
    );


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

(function init() {

    const savedUser =
        getSavedUser();


    if (!savedUser) {

        showNameScreen();

        return;

    }


    currentUser =
        savedUser;


    ensureUserData();

    saveUser();


    showContinueScreen();

})();

</script>
