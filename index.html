<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Học Tiếng Trung HSK</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

/* =========================================================
   KHUNG CHÍNH
========================================================= */

.app{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    height:var(--vh,100dvh);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.container{
    width:100%;
    max-width:700px;
    height:100%;
    margin:0 auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    flex:0 0 auto;
    background:linear-gradient(135deg,#1677ff,#005bea);
    color:white;
    border-radius:18px;
    padding:14px 12px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.header h1{
    margin:0;
    font-size:22px;
    line-height:1.15;
}

.header p{
    margin:4px 0 0;
    font-size:13px;
    opacity:.9;
}

/* =========================================================
   MÀN HÌNH CHỌN HSK
========================================================= */

.level-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
}

.level-title{
    text-align:center;
    font-size:17px;
    font-weight:bold;
    color:#555;
    margin-bottom:12px;
}

.level-menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.level-button{
    border:none;
    background:white;
    color:#333;
    border-radius:14px;
    padding:15px 5px;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.level-button:active{
    transform:scale(.97);
}

.level-button.active{
    background:#1677ff;
    color:white;
}

/* =========================================================
   MÀN HÌNH HỌC
========================================================= */

.study-screen{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* Hàng thông tin */

.top-row{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin:8px 0;
}

.top-box{
    background:white;
    border-radius:11px;
    padding:6px 4px;
    text-align:center;
    font-size:11px;
    color:#777;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.top-box strong{
    display:block;
    color:#222;
    font-size:15px;
    margin-bottom:1px;
}

/* =========================================================
   CARD CHÍNH
========================================================= */

.card{
    flex:1;
    min-height:0;
    background:white;
    border-radius:18px;
    padding:13px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.mode-title{
    flex:0 0 auto;
    text-align:center;
    font-size:11px;
    color:#888;
    margin-bottom:5px;
}

/* =========================================================
   NGHĨA TIẾNG VIỆT
========================================================= */

.question-box{
    flex:0 0 auto;
    background:#f4f7fb;
    border-radius:14px;
    padding:12px 8px;
    text-align:center;
    margin-bottom:8px;
    min-height:75px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.question-label{
    font-size:10px;
    color:#888;
    margin-bottom:3px;
}

.question{
    font-size:25px;
    font-weight:bold;
    line-height:1.15;
    color:#222;
    word-break:break-word;
}

/* =========================================================
   ĐÁP ÁN
========================================================= */

.answer-box{
    flex:0 0 auto;
    background:#e8f7ee;
    color:#16803d;
    border-radius:12px;
    padding:7px;
    text-align:center;
    margin-bottom:7px;
}

.answer-hanzi{
    font-size:23px;
    font-weight:bold;
    line-height:1.1;
}

.answer-pinyin{
    font-size:14px;
    margin-top:2px;
}

/* =========================================================
   Ô NHẬP
========================================================= */

.input-box{
    flex:0 0 auto;
    width:100%;
}

#answerInput{
    width:100%;
    height:48px;
    padding:8px 12px;
    font-size:20px;
    border:2px solid #ddd;
    border-radius:12px;
    outline:none;
    text-align:center;
    background:white;
    color:#222;
}

#answerInput:focus{
    border-color:#1677ff;
}

/* =========================================================
   HỖ TRỢ
========================================================= */

.help-button{
    flex:0 0 auto;
    width:100%;
    height:38px;
    margin-top:7px;
    border:none;
    border-radius:12px;
    background:#fff8df;
    color:#856404;
    font-size:14px;
    font-weight:bold;
}

.help-button:active{
    transform:scale(.98);
}

.hint-box{
    flex:0 0 auto;
    background:#fff8df;
    color:#856404;
    border-radius:11px;
    padding:6px;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    margin-top:5px;
    min-height:28px;
}

/* =========================================================
   THÔNG BÁO
========================================================= */

.result{
    flex:0 0 auto;
    min-height:30px;
    margin-top:6px;
    padding:6px 8px;
    border-radius:11px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.result.correct{
    background:#e8f7ee;
    color:#16803d;
}

.result.wrong{
    background:#fff0f0;
    color:#d93025;
}

.result.info{
    background:#f0f2f5;
    color:#555;
}

/* =========================================================
   NÚT QUAY LẠI
========================================================= */

.back-button{
    flex:0 0 auto;
    width:100%;
    height:38px;
    margin-top:7px;
    border:none;
    border-radius:12px;
    background:#f0f2f5;
    color:#333;
    font-size:14px;
    font-weight:bold;
}

.back-button:active{
    transform:scale(.98);
}

/* =========================================================
   ẨN
========================================================= */

.hidden{
    display:none !important;
}

/* =========================================================
   KEYBOARD IPHONE
========================================================= */

body.keyboard-open .container{
    padding:6px;
}

body.keyboard-open .header{
    padding:7px 10px;
    border-radius:12px;
}

body.keyboard-open .header h1{
    font-size:17px;
}

body.keyboard-open .header p{
    display:none;
}

body.keyboard-open .top-row{
    margin:4px 0;
}

body.keyboard-open .top-box{
    padding:3px;
    font-size:9px;
}

body.keyboard-open .top-box strong{
    font-size:12px;
}

body.keyboard-open .card{
    padding:8px;
    border-radius:14px;
}

body.keyboard-open .mode-title{
    display:none;
}

body.keyboard-open .question-box{
    min-height:52px;
    padding:6px;
    margin-bottom:5px;
}

body.keyboard-open .question-label{
    display:none;
}

body.keyboard-open .question{
    font-size:21px;
}

body.keyboard-open #answerInput{
    height:42px;
    font-size:18px;
}

body.keyboard-open .help-button{
    height:32px;
    margin-top:5px;
    font-size:12px;
}

body.keyboard-open .hint-box{
    margin-top:4px;
    padding:4px;
    font-size:13px;
}

body.keyboard-open .result{
    margin-top:4px;
    min-height:24px;
    padding:4px;
    font-size:11px;
}

body.keyboard-open .back-button{
    display:none;
}

/* =========================================================
   IPHONE MÀN HÌNH THẤP
========================================================= */

@media(max-height:700px){

    .container{
        padding:6px;
    }

    .header{
        padding:8px;
        border-radius:13px;
    }

    .header h1{
        font-size:18px;
    }

    .header p{
        display:none;
    }

    .top-row{
        margin:5px 0;
    }

    .card{
        padding:8px;
    }

    .question-box{
        min-height:55px;
        padding:7px;
    }

    .question{
        font-size:21px;
    }

    #answerInput{
        height:42px;
    }

    .help-button{
        height:34px;
    }

    .back-button{
        height:34px;
    }
}

/* =========================================================
   IPHONE RỘNG
========================================================= */

@media(min-width:431px){

    .container{
        padding:15px;
    }

    .header{
        padding:18px;
    }

    .header h1{
        font-size:25px;
    }

    .question{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>🇨🇳 HỌC TIẾNG TRUNG</h1>
        <p>Luyện từ vựng HSK 1 • HSK 2 • HSK 3</p>
    </div>


    <!-- CHỌN HSK -->

    <div id="levelScreen" class="level-screen">

        <div class="level-title">
            CHỌN CẤP ĐỘ HSK
        </div>

        <div class="level-menu">

            <button
                class="level-button"
                onclick="startLevel(1)">
                HSK 1
            </button>

            <button
                class="level-button"
                onclick="startLevel(2)">
                HSK 2
            </button>

            <button
                class="level-button"
                onclick="startLevel(3)">
                HSK 3
            </button>

        </div>

    </div>


    <!-- MÀN HÌNH HỌC -->

    <div id="studyScreen" class="study-screen hidden">

        <div class="top-row">

            <div class="top-box">
                <strong id="levelText">HSK 1</strong>
                Cấp độ
            </div>

            <div class="top-box">
                <strong id="wordNumber">1</strong>
                Từ hiện tại
            </div>

            <div class="top-box">
                <strong id="attemptText">0/3</strong>
                Lần sai
            </div>

        </div>


        <div class="card">

            <div class="mode-title">
                NHÌN NGHĨA TIẾNG VIỆT → NHẬP CHỮ HÁN
            </div>


            <!-- NGHĨA -->

            <div class="question-box">

                <div class="question-label">
                    NGHĨA TIẾNG VIỆT
                </div>

                <div
                    id="question"
                    class="question">
                </div>

            </div>


            <!-- ĐÁP ÁN -->

            <div
                id="answerBox"
                class="answer-box hidden">

                <div
                    id="answerHanzi"
                    class="answer-hanzi">
                </div>

                <div
                    id="answerPinyin"
                    class="answer-pinyin">
                </div>

            </div>


            <!-- NHẬP HANZI -->

            <div class="input-box">

                <input
                    type="text"
                    id="answerInput"
                    placeholder="Nhập chữ Hán..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="done">

            </div>


            <!-- HỖ TRỢ -->

            <button
                id="helpButton"
                class="help-button"
                onclick="showHint()">
                💡 Hỗ trợ
            </button>


            <div
                id="hintBox"
                class="hint-box hidden">
            </div>


            <!-- THÔNG BÁO -->

            <div
                id="result"
                class="result info">
            </div>


            <!-- QUAY LẠI -->

            <button
                class="back-button"
                onclick="backToLevel()">
                ← Chọn lại HSK
            </button>

        </div>

    </div>

</div>

</div>


<!-- =========================================================
     DỮ LIỆU
========================================================= -->

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>


<script>

/* =========================================================
   BIẾN
========================================================= */

let currentLevel = 1;

let currentData = [];

let currentWord = null;

let wrongAttempts = 0;

let revealed = false;

let lastIndex = -1;


/* =========================================================
   VIEWPORT IPHONE
========================================================= */

function updateViewport(){

    const viewport =
        window.visualViewport;

    const height =
        viewport
            ? viewport.height
            : window.innerHeight;

    document.documentElement.style
        .setProperty("--vh",height+"px");

    const keyboardOpen =
        height < window.innerHeight - 120;

    document.body.classList.toggle(
        "keyboard-open",
        keyboardOpen
    );
}


if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        updateViewport
    );

    window.visualViewport.addEventListener(
        "scroll",
        updateViewport
    );

}

window.addEventListener(
    "resize",
    updateViewport
);

updateViewport();


/* =========================================================
   CHỌN HSK
========================================================= */

function startLevel(level){

    currentLevel = level;

    if(level === 1){

        currentData = window.HSK1 || [];

    }

    else if(level === 2){

        currentData = [
            ...(window.HSK1 || []),
            ...(window.HSK2 || [])
        ];

    }

    else{

        currentData = [
            ...(window.HSK1 || []),
            ...(window.HSK2 || []),
            ...(window.HSK3 || [])
        ];

    }

    if(!currentData.length){

        alert("Không tìm thấy dữ liệu HSK.");

        return;

    }

    document
        .getElementById("levelScreen")
        .classList.add("hidden");

    document
        .getElementById("studyScreen")
        .classList.remove("hidden");

    document
        .getElementById("levelText")
        .textContent =
        "HSK " + level;

    nextRandomWord();

}


/* =========================================================
   TỪ NGẪU NHIÊN
========================================================= */

function nextRandomWord(){

    if(!currentData.length) return;

    let index;

    if(currentData.length === 1){

        index = 0;

    }

    else{

        do{

            index =
                Math.floor(
                    Math.random() *
                    currentData.length
                );

        }
        while(index === lastIndex);

    }

    lastIndex = index;

    currentWord =
        currentData[index];

    wrongAttempts = 0;

    revealed = false;

    document
        .getElementById("question")
        .textContent =
        currentWord[2];

    document
        .getElementById("wordNumber")
        .textContent =
        index + 1;

    document
        .getElementById("attemptText")
        .textContent =
        "0/3";

    document
        .getElementById("answerInput")
        .value = "";

    document
        .getElementById("answerInput")
        .placeholder =
        "Nhập chữ Hán...";

    document
        .getElementById("answerBox")
        .classList.add("hidden");

    document
        .getElementById("answerHanzi")
        .textContent = "";

    document
        .getElementById("answerPinyin")
        .textContent = "";

    document
        .getElementById("hintBox")
        .classList.add("hidden");

    document
        .getElementById("hintBox")
        .textContent = "";

    document
        .getElementById("result")
        .textContent =
        "Nhập chữ Hán của từ trên.";

    document
        .getElementById("result")
        .className =
        "result info";

    document
        .getElementById("answerInput")
        .focus();

}


/* =========================================================
   CHUẨN HÓA
========================================================= */

function normalizeText(text){

    return String(text)
        .trim()
        .replace(/\s+/g,"")
        .toLowerCase();

}


/* =========================================================
   KIỂM TRA TỰ ĐỘNG
========================================================= */

function checkAnswer(){

    if(!currentWord) return;

    const input =
        document.getElementById("answerInput");

    const userAnswer =
        normalizeText(input.value);

    if(!userAnswer){

        return;

    }

    const correctAnswer =
        normalizeText(currentWord[0]);


    /* ================================================
       ĐÚNG
    ================================================= */

    if(userAnswer === correctAnswer){

        document
            .getElementById("result")
            .textContent =
            "✓ Chính xác!";

        document
            .getElementById("result")
            .className =
            "result correct";

        /*
         * Nếu đang ở trạng thái phải nhập lại
         * sau khi hiện đáp án:
         * nhập đúng thì chuyển từ mới.
         */

        setTimeout(function(){

            nextRandomWord();

        },180);

        return;

    }


    /* ================================================
       SAI
    ================================================= */

    wrongAttempts++;

    document
        .getElementById("attemptText")
        .textContent =
        wrongAttempts + "/3";


    /* ================================================
       SAI LẦN 1
    ================================================= */

    if(wrongAttempts === 1){

        document
            .getElementById("result")
            .textContent =
            "✗ Chưa đúng. Thử lại.";

        document
            .getElementById("result")
            .className =
            "result wrong";

        input.value = "";

        return;

    }


    /* ================================================
       SAI LẦN 2
    ================================================= */

    if(wrongAttempts === 2){

        document
            .getElementById("result")
            .textContent =
            "✗ Chưa đúng. Thử lại lần cuối.";

        document
            .getElementById("result")
            .className =
            "result wrong";

        input.value = "";

        return;

    }


    /* ================================================
       SAI LẦN 3
    ================================================= */

    if(wrongAttempts >= 3){

        revealed = true;

        document
            .getElementById("answerHanzi")
            .textContent =
            currentWord[0];

        document
            .getElementById("answerPinyin")
            .textContent =
            currentWord[1];

        document
            .getElementById("answerBox")
            .classList.remove("hidden");

        document
            .getElementById("result")
            .innerHTML =
            "✗ Đã sai 3 lần.<br>Hãy nhập lại đúng chữ Hán.";

        document
            .getElementById("result")
            .className =
            "result wrong";

        input.value = "";

        input.placeholder =
            "Nhập lại chữ Hán đáp án...";

    }

}


/* =========================================================
   HỖ TRỢ PINYIN
========================================================= */

function showHint(){

    if(!currentWord) return;

    const pinyin =
        currentWord[1];

    const hint =
        makePinyinHint(pinyin);

    const box =
        document.getElementById("hintBox");

    box.textContent =
        "💡 " + hint;

    box.classList.remove("hidden");

}


/* =========================================================
   TẠO GỢI Ý PINYIN
========================================================= */

function makePinyinHint(pinyin){

    const clean =
        String(pinyin)
            .trim()
            .replace(/'/g," ");

    const syllables =
        clean.split(/\s+/);

    return syllables
        .map(function(syllable){

            const match =
                syllable.match(
                    /^[a-zA-ZüÜ]+/
                );

            if(!match) return "---";

            const letters =
                match[0];

            let prefix = "";

            if(letters.length >= 2){

                /*
                 * zh / ch / sh giữ 2 chữ
                 */

                const lower =
                    letters.toLowerCase();

                if(
                    lower.startsWith("zh") ||
                    lower.startsWith("ch") ||
                    lower.startsWith("sh")
                ){

                    prefix =
                        letters.substring(0,2);

                }

                else{

                    prefix =
                        letters.substring(0,1);

                }

            }

            else{

                prefix = letters;

            }

            return prefix + "---";

        })
        .join(" ");

}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById("answerInput")
    .addEventListener(
        "input",
        function(){

            /*
             * Chỉ kiểm tra khi người dùng đã nhập.
             */

            const value =
                this.value.trim();

            if(!value) return;

            checkAnswer();

        }
    );


/* =========================================================
   QUAY LẠI CHỌN HSK
========================================================= */

function backToLevel(){

    document
        .getElementById("studyScreen")
        .classList.add("hidden");

    document
        .getElementById("levelScreen")
        .classList.remove("hidden");

    currentWord = null;

    document
        .getElementById("answerInput")
        .blur();

}


/* =========================================================
   LOAD
========================================================= */

window.addEventListener(
    "load",
    function(){

        document
            .getElementById("answerInput")
            .blur();

    }
);

</script>

</body>
</html>
