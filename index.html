<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no”

<title>TIẾNG TRUNG LEEBACC</title>
<style>
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}
body {
    background:
        linear-gradient(
            135deg,
            #f1f5f9,
            #e2e8f0
        );
    color: #222;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    transition:
        padding .25s ease;
}
button,
input {
    font-family: inherit;
}
/* =========================================================
   APP
========================================================= */
.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    background: #f8fafc;
    box-shadow:
        0 0 30px rgba(
            0,
            0,
            0,
            .08
        );
}
/* =========================================================
   HEADER
========================================================= */
.header {
    background:
        linear-gradient(
            135deg,
            #d32f2f,
            #b71c1c
        );
    color: white;
    text-align: center;
    padding: 20px 14px;
    box-shadow:
        0 4px 12px rgba(
            0,
            0,
            0,
            .15
        );
    transition:
        padding .25s ease;
}
.header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: .5px;
}
.header p {
    margin: 6px 0 0;
    font-size: 13px;
    opacity: .9;
}
/* =========================================================
   SCREEN
========================================================= */
.screen {
    display: none;
    padding:
        20px 16px 30px;
    animation:
        screenIn .3s ease;
}
.screen.active {
    display: block;
}
/* =========================================================
   ANIMATION
========================================================= */
@keyframes screenIn {
    from {
        opacity: 0;
        transform:
            translateY(10px);
    }
    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}
@keyframes popIn {
    from {
        opacity: 0;
        transform:
            scale(.96)
            translateY(5px);
    }
    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}
@keyframes shake {
    0%,
    100% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-7px);
    }
    75% {
        transform: translateX(7px);
    }
}
@keyframes correct {
    0% {
        transform: scale(.95);
    }
    50% {
        transform: scale(1.03);
    }
    100% {
        transform: scale(1);
    }
}
@keyframes help {
    from {
        opacity: 0;
        transform:
            translateY(-8px)
            scale(.97);
    }
    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}
/* =========================================================
   LEVEL
========================================================= */
.level-title {
    text-align: center;
    margin-bottom: 22px;
}
/*
   Ô màu tiêu đề
*/
.level-title h2 {
    display: inline-block;
    margin: 0;
    padding:
        10px 18px;
    border-radius: 14px;
    background: #fff3f3;
    color: #b71c1c;
    box-shadow:
        0 4px 12px rgba(
            183,
            28,
            28,
            .08
        );
}
.level-title p {
    margin:
        12px 0 0;
    color: #777;
    font-size: 14px;
}
/* =========================================================
   LEVEL GRID
========================================================= */
.level-grid {
    display: grid;
    grid-template-columns:
        repeat(
            3,
            1fr
        );
    gap: 10px;
}
/* =========================================================
   LEVEL CARD
========================================================= */
.level-card {
    border: 2px solid #e5e7eb;
    border-radius: 18px;
    padding:
        20px 5px;
    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f8fafc
        );
    color: #333;
    font-size: 14px;
    font-weight: bold;
    box-shadow:
        0 5px 14px rgba(
            0,
            0,
            0,
            .07
        );
    transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
}
.level-card:active {
    transform:
        scale(.95);
    box-shadow:
        0 2px 6px rgba(
            0,
            0,
            0,
            .1
        );
}
.level-card strong {
    display: block;
    color: #c62828;
    font-size: 25px;
    margin-bottom: 8px;
}
/* =========================================================
   STUDY
========================================================= */
.study {
    text-align: center;
}
/* =========================================================
   COUNTER BOX
========================================================= */
.counter-box {
    display: inline-block;
    padding:
        7px 14px;
    border-radius: 20px;
    background: #ffffff;
    color: #777;
    font-size: 13px;
    box-shadow:
        0 3px 10px rgba(
            0,
            0,
            0,
            .06
        );
    margin-bottom: 12px;
}
/* =========================================================
   PROGRESS
========================================================= */
.progress-box {
    background: white;
    border-radius: 12px;
    padding: 5px;
    box-shadow:
        0 3px 10px rgba(
            0,
            0,
            0,
            .05
        );
    margin-bottom: 20px;
}
.progress {
    height: 7px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background:
        linear-gradient(
            90deg,
            #ef5350,
            #c62828
        );
    border-radius: 20px;
    transition:
        width .3s ease;
}
/* =========================================================
   MEANING BOX
========================================================= */
.meaning-box {
    background:
        linear-gradient(
            145deg,
            #fff7ed,
            #ffedd5
        );
    border:
        1px solid #fed7aa;
    border-radius: 20px;
    padding:
        20px 14px;
    margin-bottom: 15px;
    box-shadow:
        0 6px 16px rgba(
            0,
            0,
            0,
            .07
        );
    animation:
        popIn .3s ease;
}
.meaning-label {
    display: inline-block;
    padding:
        5px 10px;
    border-radius: 10px;
    background: #fff;
    color: #9a3412;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
}
.meaning {
    min-height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7c2d12;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.25;
}
/* =========================================================
   HINT BOX
========================================================= */
.hint-box {
    display: inline-block;
    padding:
        7px 12px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 13px;
    font-weight: bold;
}
/* =========================================================
   INPUT BOX
========================================================= */
.input-box {
    background: white;
    border-radius: 18px;
    padding: 10px;
    box-shadow:
        0 5px 16px rgba(
            0,
            0,
            0,
            .07
        );
    margin-bottom: 10px;
}
.answer-input {
    width: 100%;
    padding:
        15px 12px;
    border:
        2px solid #e5e7eb;
    border-radius: 13px;
    outline: none;
    background: #fafafa;
    color: #111;
    font-size: 27px;
    text-align: center;
    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}
.answer-input:focus {
    border-color: #c62828;
    background: white;
    box-shadow:
        0 0 0 4px rgba(
            198,
            40,
            40,
            .1
        );
}
/* =========================================================
   BUTTON
========================================================= */
.btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding:
        14px;
    margin-top: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}
.btn:active {
    transform:
        scale(.97);
}
.secondary {
    background: #e5e7eb;
    color: #374151;
    box-shadow:
        0 3px 8px rgba(
            0,
            0,
            0,
            .05
        );
}
.help {
    background:
        linear-gradient(
            135deg,
            #fff7b2,
            #fde68a
        );
    color: #713f12;
    border:
        1px solid #facc15;
    box-shadow:
        0 4px 10px rgba(
            234,
            179,
            8,
            .15
        );
}
/* =========================================================
   HELP BOX
========================================================= */
.help-box {
    display: none;
    margin-top: 10px;
    padding:
        13px;
    border-radius: 15px;
    background:
        linear-gradient(
            135deg,
            #fef9c3,
            #fef3c7
        );
    border:
        1px solid #facc15;
    color: #854d0e;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow:
        0 4px 12px rgba(
            0,
            0,
            0,
            .06
        );
}
.help-box.show {
    display: block;
    animation:
        help .3s ease;
}
/* =========================================================
   RESULT BOX
========================================================= */
.result-box {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    border-radius: 14px;
    padding:
        8px 12px;
    font-size: 16px;
    font-weight: bold;
    transition:
        all .2s ease;
}
.result-box:empty {
    background: transparent;
}
.result-box.correct {
    background: #dcfce7;
    color: #166534;
    border:
        1px solid #86efac;
    animation:
        correct .3s ease;
}
.result-box.wrong {
    background: #fee2e2;
    color: #991b1b;
    border:
        1px solid #fca5a5;
    animation:
        shake .3s ease;
}
/* =========================================================
   SOLUTION BOX
========================================================= */
.solution {
    display: none;
    margin-top: 10px;
    padding:
        15px;
    border-radius: 17px;
    background:
        linear-gradient(
            135deg,
            #fce7f3,
            #fdf2f8
        );
    border:
        1px solid #f9a8d4;
    color: #831843;
    font-size: 21px;
    line-height: 1.55;
    box-shadow:
        0 5px 14px rgba(
            0,
            0,
            0,
            .06
        );
    animation:
        popIn .3s ease;
}
.solution b {
    color: #be123c;
    font-size: 27px;
}
/* =========================================================
   NOTE BOX
========================================================= */
.note-box {
    margin-top: 12px;
    padding:
        10px;
    border-radius: 12px;
    background: #f1f5f9;
    color: #64748b;
    font-size: 12px;
    line-height: 1.5;
}
/* =========================================================
   KEYBOARD OPEN MODE
========================================================= */
body.keyboard-open {
    background: #f8fafc;
}
body.keyboard-open .header {
    padding:
        8px 12px;
}
body.keyboard-open .header h1 {
    font-size: 17px;
}
body.keyboard-open .header p {
    display: none;
}
body.keyboard-open .screen {
    padding:
        8px 12px 20px;
}
body.keyboard-open .counter-box {
    margin-bottom: 7px;
}
body.keyboard-open .progress-box {
    margin-bottom: 10px;
}
body.keyboard-open .meaning-box {
    padding:
        10px 10px;
    margin-bottom: 8px;
}
body.keyboard-open .meaning-label {
    display: none;
}
body.keyboard-open .meaning {
    min-height: 48px;
    font-size: 24px;
}
body.keyboard-open .hint-box {
    margin-bottom: 6px;
    padding:
        5px 9px;
}
body.keyboard-open .input-box {
    padding: 6px;
    margin-bottom: 6px;
}
body.keyboard-open .answer-input {
    padding:
        10px;
    font-size: 23px;
}
body.keyboard-open .btn {
    padding:
        10px;
    margin-top: 6px;
}
body.keyboard-open .note-box {
    display: none;
}
/* =========================================================
   SMALL SCREEN
========================================================= */
@media (max-width: 380px) {
    .level-grid {
        grid-template-columns:
            1fr;
    }
    .meaning {
        font-size: 26px;
    }
}
/* =========================================================
   VERY SMALL HEIGHT
========================================================= */
@media (
    max-height: 650px
) {
    .header {
        padding:
            10px;
    }
    .meaning-box {
        padding:
            10px;
    }
    .meaning {
        min-height: 50px;
        font-size: 24px;
    }
    .note-box {
        display: none;
    }
}
</style>

<body>
<div class="app">
<!-- =====================================================
     HEADER
===================================================== -->
<header class="header">

</h1>

</p>
</header>
<!-- =====================================================
     LEVEL SCREEN
===================================================== -->
<section

    </h2>

<!-- COUNTER -->

================================================= -->

    <div class="meaning-label">

    </div>
    <div
        id="meaning"
        class="meaning"

        ...
    </div>

<!-- HINT -->
<div class="hint-box">
    Nhập chữ Hán của từ trên

     INPUT

<!-- =====================================================
     DATA
===================================================== -->
<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>
<script>
/* =========================================================
   BIẾN
========================================================= */
let currentLevel = 1;
let currentWords = [];
let randomWords = [];
let currentWord = null;
let wrongCount = 0;
let mustRepeatAnswer = false;
let completedCount = 0;
/* =========================================================
   LẤY VOCABULARY
========================================================= */
function getVocabulary(level) {
    let data = [];
    if (
        level >= 1 &&
        Array.isArray(window.HSK1)
    ) {
        data =
            data.concat(
                window.HSK1
            );
    }
    if (
        level >= 2 &&
        Array.isArray(window.HSK2)
    ) {
        data =
            data.concat(
                window.HSK2
            );
    }
    if (
        level >= 3 &&
        Array.isArray(window.HSK3)
    ) {
        data =
            data.concat(
                window.HSK3
            );
    }
    const words =
        data.map(
            function(item) {
                return {
                    hanzi:
                        item[0] || "",
                    pinyin:
                        item[1] || "",
                    meaning:
                        item[2] || ""
                };
            }
        );
    /*
       Xóa bản ghi trùng hoàn toàn
    */
    const seen =
        new Set();
    return words.filter(
        function(word) {
            const key =
                word.hanzi +
                "|" +
                word.pinyin +
                "|" +
                word.meaning;
            if (
                seen.has(key)
            ) {
                return false;
            }
            seen.add(key);
            return true;
        }
    );
}
/* =========================================================
   SHUFFLE
========================================================= */
function shuffle(array) {
    const copy =
        array.slice();
    for (
        let i =
            copy.length - 1;
        i > 0;
        i--
    ) {
        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );
        const temp =
            copy[i];
        copy[i] =
            copy[j];
        copy[j] =
            temp;
    }
    return copy;
}
/* =========================================================
   CHUẨN HÓA HANZI
========================================================= */
function normalizeHanzi(text) {
    return String(
        text || ""
    )
    .trim()
    .normalize("NFC")
    .replace(
        /\s+/g,
        ""
    );
}
/* =========================================================
   KIỂM TRA
========================================================= */
function isCorrect(
    input,
    word
) {
    return (
        normalizeHanzi(input)
        ===
        normalizeHanzi(
            word.hanzi
        )
    );
}
/* =========================================================
   TẠO GỢI Ý PINYIN
========================================================= */
function createHelpHint(word) {
    const pinyin =
        String(
            word.pinyin || ""
        ).trim();
    /*
       Nếu Pinyin trong dữ liệu
       có khoảng trắng:
       xué xiào
       → x--- x---
    */
    if (
        pinyin.includes(" ")
    ) {
        return pinyin
            .split(/\s+/)
            .filter(Boolean)
            .map(
                function(syllable) {
                    return (
                        syllable.charAt(0) +
                        "---"
                    );
                }
            )
            .join(" ");
    }
    /*
       Nếu Pinyin không có khoảng trắng,
       lấy số âm tiết theo số chữ Hán.
       Đây là cách hiển thị gợi ý
       đơn giản và dễ nhìn.
    */
    const chars =
        Array.from(
            word.hanzi || ""
        );
    const count =
        chars.length;
    /*
       Lấy các chữ cái đầu có thể
       xuất hiện trong Pinyin.
    */
    const initials = [
        "zh",
        "ch",
        "sh",
        "b",
        "p",
        "m",
        "f",
        "d",
        "t",
        "n",
        "l",
        "g",
        "k",
        "h",
        "j",
        "q",
        "x",
        "r",
        "z",
        "c",
        "s",
        "y",
        "w"
    ];
    let result = [];
    let position = 0;
    for (
        let i = 0;
        i < count;
        i++
    ) {
        if (
            position >=
            pinyin.length
        ) {
            result.push(
                "---"
            );
            continue;
        }
        let initial = "";
        const two =
            pinyin.substring(
                position,
                position + 2
            );
        if (
            initials.includes(
                two
            )
        ) {
            initial =
                two;
        }
        else {
            initial =
                pinyin.charAt(
                    position
                );
        }
        result.push(
            initial +
            "---"
        );
        /*
           Ước lượng vị trí âm tiết
           tiếp theo.
           Tìm nguyên âm tiếp theo
           sau phần đầu.
        */
        const vowels =
            "aeiouü";
        let foundVowel =
            false;
        while (
            position <
            pinyin.length
        ) {
            const c =
                pinyin.charAt(
                    position
                ).normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                );
            position++;
            if (
                vowels.includes(
                    c.toLowerCase()
                )
            ) {
                foundVowel =
                    true;
                break;
            }
        }
        if (
            foundVowel
        ) {
            while (
                position <
                pinyin.length
            ) {
                const next =
                    pinyin.charAt(
                        position
                    ).toLowerCase();
                /*
                   Nếu gặp một phụ âm đầu
                   có khả năng bắt đầu
                   âm tiết tiếp theo.
                */
                let isInitial =
                    false;
                for (
                    const initialItem
                    of initials
                ) {
                    if (
                        pinyin
                        .substring(
                            position,
                            position +
                            initialItem.length
                        )
                        .toLowerCase()
                        ===
                        initialItem
                    ) {
                        isInitial =
                            true;
                        break;
                    }
                }
                if (
                    isInitial
                ) {
                    break;
                }
                position++;
            }
        }
    }
    /*
       Đảm bảo đủ số âm tiết.
    */
    while (
        result.length <
        count
    ) {
        result.push(
            "---"
        );
    }
    return result.join(
        " "
    );
}
/* =========================================================
   CHỌN LEVEL
========================================================= */
function startLevel(level) {
    currentLevel =
        level;
    currentWords =
        getVocabulary(
            level
        );
    if (
        !currentWords.length
    ) {
        alert(
            "Chưa có dữ liệu HSK."
        );
        return;
    }
    randomWords =
        shuffle(
            currentWords
        );
    currentWord =
        null;
    wrongCount =
        0;
    mustRepeatAnswer =
        false;
    completedCount =
        0;
    localStorage.setItem(
        "leebacc_level",
        String(level)
    );
    document.getElementById(
        "levelText"
    ).textContent =
        level;
    document.getElementById(
        "countText"
    ).textContent =
        "0 / " +
        currentWords.length;
    showScreen(
        "studyScreen"
    );
    nextRandomWord();
}
/* =========================================================
   TỪ TIẾP THEO
========================================================= */
function nextRandomWord() {
    if (
        randomWords.length === 0
    ) {
        randomWords =
            shuffle(
                currentWords
            );
    }
    currentWord =
        randomWords.pop();
    wrongCount =
        0;
    mustRepeatAnswer =
        false;
    /*
       Nghĩa
    */
    const meaning =
        document.getElementById(
            "meaning"
        );
    meaning.textContent =
        currentWord.meaning;
    /*
       Input
    */
    const input =
        document.getElementById(
            "answerInput"
        );
    input.value = "";
    input.disabled = false;
    /*
       Result
    */
    const result =
        document.getElementById(
            "result"
        );
    result.textContent = "";
    result.className =
        "result-box";
    /*
       Help
    */
    const helpBox =
        document.getElementById(
            "helpBox"
        );
    helpBox.textContent =
        "";
    helpBox.classList.remove(
        "show"
    );
    document.getElementById(
        "helpButton"
    ).style.display =
        "block";
    /*
       Solution
    */
    document.getElementById(
        "solution"
    ).style.display =
        "none";
    /*
       Counter
    */
    completedCount++;
    document.getElementById(
        "countText"
    ).textContent =
        completedCount +
        " / " +
        currentWords.length;
    /*
       Progress
    */
    const percent =
        Math.min(
            completedCount,
            currentWords.length
        )
        /
        currentWords.length
        *
        100;
    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";
    /*
       Focus
    */
    setTimeout(
        function() {
            input.focus();
            scrollInputIntoView();
        },
        100
    );
}
/* =========================================================
   HỖ TRỢ
========================================================= */
function showHelp() {
    if (
        !currentWord
    ) {
        return;
    }
    const helpBox =
        document.getElementById(
            "helpBox"
        );
    /*
       Nếu đã hiện
       không hiện lại.
    */
    if (
        helpBox.classList.contains(
            "show"
        )
    ) {
        return;
    }
    helpBox.textContent =
        createHelpHint(
            currentWord
        );
    helpBox.classList.add(
        "show"
    );
}
/* =========================================================
   KIỂM TRA ĐÁP ÁN
========================================================= */
function checkAnswer() {
    if (
        !currentWord
    ) {
        return;
    }
    const input =
        document.getElementById(
            "answerInput"
        );
    const value =
        input.value.trim();
    if (
        !value
    ) {
        return;
    }
    const result =
        document.getElementById(
            "result"
        );
    /*
       ĐÚNG
    */
    if (
        isCorrect(
            value,
            currentWord
        )
    ) {
        result.textContent =
            mustRepeatAnswer
                ? "✓ Đúng! Sang từ tiếp theo."
                : "✓ Chính xác!";
        result.className =
            "result-box correct";
        setTimeout(
            function() {
                nextRandomWord();
            },
            550
        );
        return;
    }
    /*
       SAI
    */
    wrongCount++;
    result.textContent =
        "✗ Sai lần " +
        wrongCount +
        "/3";
    result.className =
        "result-box wrong";
    /*
       SAI 3 LẦN
    */
    if (
        wrongCount >= 3
    ) {
        mustRepeatAnswer =
            true;
        const solution =
            document.getElementById(
                "solution"
            );
        solution.innerHTML =
            "Đáp án: <b>" +
            escapeHTML(
                currentWord.hanzi
            ) +
            "</b><br>" +
            escapeHTML(
                currentWord.pinyin
            );
        solution.style.display =
            "block";
        result.textContent =
            "Đã sai 3 lần. Hãy nhập lại chữ Hán đúng.";
        /*
           Không cho chuyển từ
           cho đến khi nhập đúng.
        */
        input.value = "";
        input.focus();
        scrollInputIntoView();
    }
}
/* =========================================================
   ENTER
========================================================= */
document
    .getElementById(
        "answerInput"
    )
    .addEventListener(
        "keydown",
        function(event) {
            if (
                event.key === "Enter"
            ) {
                event.preventDefault();
                checkAnswer();
            }
        }
    );
/* =========================================================
   XỬ LÝ BÀN PHÍM
========================================================= */
const answerInput =
    document.getElementById(
        "answerInput"
    );
answerInput.addEventListener(
    "focus",
    function() {
        document.body.classList.add(
            "keyboard-open"
        );
        setTimeout(
            function() {
                scrollInputIntoView();
            },
            300
        );
    }
);
answerInput.addEventListener(
    "blur",
    function() {
        setTimeout(
            function() {
                /*
                   Nếu focus chuyển sang
                   nút khác thì vẫn giữ
                   giao diện gọn.
                */
                if (
                    document.activeElement !==
                    answerInput
                ) {
                    document.body.classList.remove(
                        "keyboard-open"
                    );
                }
            },
            150
        );
    }
);
/* =========================================================
   TỰ CUỘN Ô NHẬP
========================================================= */
function scrollInputIntoView() {
    const input =
        document.getElementById(
            "answerInput"
        );
    if (
        !input
    ) {
        return;
    }
    setTimeout(
        function() {
            input.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        },
        80
    );
}
/* =========================================================
   SHOW SCREEN
========================================================= */
function showScreen(id) {
    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            function(screen) {
                screen.classList.remove(
                    "active"
                );
            }
        );
    const target =
        document.getElementById(
            id
        );
    if (
        target
    ) {
        target.classList.add(
            "active"
        );
    }
    window.scrollTo(
        0,
        0
    );
}
/* =========================================================
   QUAY LẠI CHỌN HSK
========================================================= */
function backToLevel() {
    document.body.classList.remove(
        "keyboard-open"
    );
    showScreen(
        "levelScreen"
    );
}
/* =========================================================
   ESCAPE HTML
========================================================= */
function escapeHTML(text) {
    return String(
        text
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}
