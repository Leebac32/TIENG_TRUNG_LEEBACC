<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIẾNG TRUNG LEEBACC</title>

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#1677ff,#005bea);
    color:white;
    border-radius:18px;
    padding:20px 12px;
    text-align:center;
    margin-bottom:8px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
}

/* USER AREA */

.user-area{
    background:white;
    border-radius:14px;
    padding:12px;
    margin-bottom:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    text-align:center;
}

.user-greeting{
    font-size:15px;
    font-weight:600;
    margin-bottom:5px;
}

.user-progress{
    font-size:13px;
    color:#555;
    margin-bottom:10px;
}

.user-actions{
    display:grid;
    grid-template-columns:1fr;
    gap:7px;
}

.user-actions button{
    border:none;
    border-radius:11px;
    padding:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.continue-button{
    background:#1677ff;
    color:white;
}

.change-user-button{
    background:#f1f3f5;
    color:#444;
}

/* NAME SCREEN */

.name-screen{
    position:fixed;
    inset:0;
    background:#f4f6f8;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.name-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
    text-align:center;
}

.name-box h2{
    margin:0;
    font-size:22px;
    color:#1677ff;
}

.name-box p{
    color:#666;
    font-size:14px;
    margin:8px 0 18px;
}

.start-button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:13px;
    background:#1677ff;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

/* MENU */

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:7px;
}

.menu button{
    border:none;
    background:white;
    border-radius:10px;
    padding:8px 4px;
    font-size:14px;
    font-weight:700;
    color:#444;
    cursor:pointer;
    box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.menu button.active{
    background:#1677ff;
    color:white;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-bottom:7px;
}

.stat{
    background:white;
    border-radius:8px;
    padding:6px 3px;
    text-align:center;
    box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.stat-number{
    font-size:13px;
    line-height:15px;
    font-weight:700;
}

.stat-label{
    font-size:8px;
    line-height:10px;
    color:#777;
    margin-top:2px;
}

/* PROGRESS */

.progress{
    height:5px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:8px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#1677ff;
    transition:width .25s;
}

/* CARD */

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.mode-title{
    text-align:center;
    font-size:14px;
    color:#1677ff;
    font-weight:700;
    margin-bottom:16px;
}

.question{
    text-align:center;
    font-size:25px;
    font-weight:700;
    min-height:48px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:20px;
    text-align:center;
    outline:none;
    background:white;
}

input:focus{
    border-color:#1677ff;
}

.input-correct{
    border-color:#22c55e!important;
    background:#f0fdf4!important;
    color:#15803d!important;
}

.input-wrong{
    border-color:#ef4444!important;
    background:#fef2f2!important;
    color:#dc2626!important;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:10px;
}

.actions button{
    border:none;
    border-radius:11px;
    padding:11px 7px;
    background:#1677ff;
    color:white;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
}

/* RESULT */

.result{
    margin-top:10px;
    text-align:center;
    min-height:0;
}

.result.correct{
    color:#16a34a;
}

.result.wrong{
    color:#dc2626;
}

.answer{
    margin-top:5px;
    font-size:21px;
    font-weight:700;
    color:#222;
}

.answer-pinyin{
    margin-top:3px;
    color:#1677ff;
    font-size:17px;
    font-weight:600;
}

.info{
    text-align:center;
    color:#888;
    font-size:11px;
    margin-top:10px;
    min-height:16px;
}

.hidden{
    display:none!important;
}

@media(max-width:430px){
    .container{
        padding:7px;
    }

    .header{
        padding:16px 8px;
        border-radius:15px;
    }

    .header h1{
        font-size:21px;
    }

    .header p{
        font-size:12px;
    }

    .menu button{
        font-size:13px;
        padding:8px 3px;
    }

    .card{
        padding:15px;
    }

    .question{
        font-size:22px;
    }

    input{
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- NHẬP TÊN -->

<div id="nameScreen" class="name-screen hidden">
    <div class="name-box">

        <h2>🇨🇳 TIẾNG TRUNG LEEBACC</h2>

        <p>Nhập tên để lưu tiến độ học của bạn</p>

        <input
            id="nameInput"
            type="text"
            autocomplete="name"
            placeholder="Nhập tên của bạn..."
        >

        <button
            class="start-button"
            onclick="startLearning()"
        >
            ▶ Bắt đầu học
        </button>

    </div>
</div>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🇨🇳 TIẾNG TRUNG LEEBACC</h1>

        <p id="headerUserName">Luyện viết chữ Hán</p>

    </div>

    <!-- TIẾP TỤC -->

    <div id="userArea" class="user-area hidden">

        <div id="userGreeting" class="user-greeting"></div>

        <div id="userProgress" class="user-progress"></div>

        <div class="user-actions">

            <button
                class="continue-button"
                onclick="continueLearning()"
            >
                ▶ Tiếp tục học
            </button>

            <button
                class="change-user-button"
                onclick="changeUser()"
            >
                👤 Đổi người học
            </button>

        </div>

    </div>

    <!-- KHU HỌC -->

    <div id="learningArea" class="hidden">

        <!-- HSK -->

        <div class="menu">

            <button
                id="hsk1Button"
                onclick="selectHSK(1)"
            >
                HSK 1
            </button>

            <button
                id="hsk2Button"
                onclick="selectHSK(2)"
            >
                HSK 2
            </button>

            <button
                id="hsk3Button"
                onclick="selectHSK(3)"
            >
                HSK 3
            </button>

        </div>

        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <div id="correctCount" class="stat-number">0</div>
                <div class="stat-label">Đúng</div>
            </div>

            <div class="stat">
                <div id="wrongCount" class="stat-number">0</div>
                <div class="stat-label">Sai</div>
            </div>

            <div class="stat">
                <div id="doneCount" class="stat-number">0</div>
                <div class="stat-label">Đã làm</div>
            </div>

            <div class="stat">
                <div id="accuracy" class="stat-number">0%</div>
                <div class="stat-label">Tỷ lệ</div>
            </div>

        </div>

        <!-- PROGRESS -->

        <div class="progress">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <!-- CARD -->

        <div class="card">

            <div id="modeTitle" class="mode-title">
                HSK 1 • LUYỆN VIẾT
            </div>

            <div id="question" class="question">
                Đang tải...
            </div>

            <input
                id="answerInput"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Nhập chữ Hán..."
            >

            <div class="actions">

                <button onclick="showPreviousQuestion()">
                    ← Câu vừa làm
                </button>

                <button onclick="shuffleCurrentLevel()">
                    🔀 Xáo trộn
                </button>

            </div>

            <div id="result" class="result"></div>

            <div id="hint" class="info">
                Sai 3 lần sẽ hiện đáp án.
            </div>

        </div>

    </div>

</div>

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY = "leebacc_hsk_user_v3";

/* =====================================================
   DATA
===================================================== */

const hskData = {
    1: Array.isArray(window.HSK1) ? [...window.HSK1] : [],
    2: Array.isArray(window.HSK2) ? [...window.HSK2] : [],
    3: Array.isArray(window.HSK3) ? [...window.HSK3] : []
};

/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentHSK = 1;
let currentIndex = 0;
let currentQuestion = null;

let wrongAttempts = 0;
let answerShown = false;
let questionCompleted = false;

let lastQuestion = null;
let hasPreviousQuestion = false;

let nextTimer = null;

let correctCount = 0;
let wrongCount = 0;
let doneCount = 0;

/* =====================================================
   LOCAL STORAGE
===================================================== */

function getSavedUser(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(!saved){
            return null;
        }

        return JSON.parse(saved);

    }catch(error){

        console.error(error);
        return null;

    }
}

function saveUser(){

    if(!currentUser){
        return;
    }

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(currentUser)
    );
}

/* =====================================================
   LEVEL PROGRESS
===================================================== */

function createLevelProgress(level){

    const data = hskData[level] || [];

    return {
        order: data.map(function(item,index){
            return index;
        }),
        index: 0,
        correct: 0,
        wrong: 0,
        done: 0
    };
}

function ensureUserData(){

    if(!currentUser){
        return;
    }

    if(!currentUser.hsk){
        currentUser.hsk = {};
    }

    [1,2,3].forEach(function(level){

        if(
            !currentUser.hsk[level] ||
            !Array.isArray(currentUser.hsk[level].order)
        ){

            currentUser.hsk[level] =
                createLevelProgress(level);

        }

    });
}

function getLevelProgress(level){

    ensureUserData();

    return currentUser.hsk[level];
}

/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        const temp = array[i];

        array[i] = array[j];
        array[j] = temp;
    }
}

function createShuffledOrder(level){

    const data = hskData[level] || [];

    const order =
        data.map(function(item,index){
            return index;
        });

    shuffle(order);

    return order;
}

/* =====================================================
   RANDOM MỖI LẦN VÀO
===================================================== */

function randomizeLevel(level){

    const progress =
        getLevelProgress(level);

    /*
       QUAN TRỌNG:
       Luôn tạo order mới.
       Không lấy order cũ.
    */

    progress.order =
        createShuffledOrder(level);

    progress.index = 0;

    return progress;
}

/* =====================================================
   CREATE USER
===================================================== */

function createUser(name){

    currentUser = {

        name:name,

        lastHSK:1,

        hsk:{
            1:createLevelProgress(1),
            2:createLevelProgress(2),
            3:createLevelProgress(3)
        }

    };

    saveUser();
}

/* =====================================================
   NAME SCREEN
===================================================== */

function showNameScreen(){

    document
        .getElementById("nameScreen")
        .classList.remove("hidden");

    document
        .getElementById("learningArea")
        .classList.add("hidden");

    document
        .getElementById("userArea")
        .classList.add("hidden");

    document
        .getElementById("headerUserName")
        .textContent =
        "Luyện viết chữ Hán";

    setTimeout(function(){

        document
            .getElementById("nameInput")
            .focus();

    },100);
}

function startLearning(){

    const input =
        document.getElementById("nameInput");

    const name =
        input.value.trim();

    if(!name){

        input.focus();
        return;

    }

    createUser(name);

    document
        .getElementById("nameScreen")
        .classList.add("hidden");

    enterLearning();
}

/* =====================================================
   CONTINUE SCREEN
===================================================== */

function showContinueScreen(){

    if(!currentUser){

        showNameScreen();
        return;

    }

    ensureUserData();

    const level =
        Number(currentUser.lastHSK) || 1;

    const progress =
        getLevelProgress(level);

    const total =
        hskData[level].length;

    document
        .getElementById("userGreeting")
        .textContent =
        "👤 Xin chào, " +
        currentUser.name;

    document
        .getElementById("userProgress")
        .textContent =
        "HSK " +
        level +
        " — Đã học " +
        progress.done +
        "/" +
        total +
        " câu";

    document
        .getElementById("userArea")
        .classList.remove("hidden");

    document
        .getElementById("learningArea")
        .classList.add("hidden");

    document
        .getElementById("headerUserName")
        .textContent =
        "Luyện viết chữ Hán";
}

/* =====================================================
   ENTER LEARNING
===================================================== */

function enterLearning(){

    if(!currentUser){
        return;
    }

    ensureUserData();

    document
        .getElementById("nameScreen")
        .classList.add("hidden");

    document
        .getElementById("userArea")
        .classList.add("hidden");

    document
        .getElementById("learningArea")
        .classList.remove("hidden");

    /*
       TÊN HIỆN NGAY DƯỚI TIÊU ĐỀ
    */

    document
        .getElementById("headerUserName")
        .textContent =
        "👤 " + currentUser.name;

    let level =
        Number(currentUser.lastHSK) || 1;

    if(level !== 1 && level !== 2 && level !== 3){
        level = 1;
    }

    /*
       MỖI LẦN VÀO LẠI WEB:
       RANDOM LẠI HSK CUỐI CÙNG.
    */

    randomizeLevel(level);

    currentHSK = level;
    currentIndex = 0;

    const progress =
        getLevelProgress(level);

    correctCount =
        progress.correct || 0;

    wrongCount =
        progress.wrong || 0;

    doneCount =
        progress.done || 0;

    currentUser.lastHSK = level;

    saveUser();

    loadQuestion();
}

/* =====================================================
   CONTINUE
===================================================== */

function continueLearning(){

    if(!currentUser){

        showNameScreen();
        return;

    }

    enterLearning();
}

/* =====================================================
   CHANGE USER
===================================================== */

function changeUser(){

    if(nextTimer){

        clearTimeout(nextTimer);
        nextTimer = null;

    }

    document
        .getElementById("nameInput")
        .value = "";

    showNameScreen();
}

/* =====================================================
   SELECT HSK
===================================================== */

function selectHSK(level){

    if(nextTimer){

        clearTimeout(nextTimer);
        nextTimer = null;

    }

    /*
       CHỌN HSK NÀO
       RANDOM RIÊNG HSK ĐÓ.
    */

    randomizeLevel(level);

    currentHSK = level;
    currentIndex = 0;

    const progress =
        getLevelProgress(level);

    correctCount =
        progress.correct || 0;

    wrongCount =
        progress.wrong || 0;

    doneCount =
        progress.done || 0;

    currentUser.lastHSK = level;

    saveUser();

    document
        .getElementById("hsk1Button")
        .classList.remove("active");

    document
        .getElementById("hsk2Button")
        .classList.remove("active");

    document
        .getElementById("hsk3Button")
        .classList.remove("active");

    document
        .getElementById("hsk" + level + "Button")
        .classList.add("active");

    loadQuestion();
}

/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    const data =
        hskData[currentHSK];

    const progress =
        getLevelProgress(currentHSK);

    const input =
        document.getElementById("answerInput");

    const result =
        document.getElementById("result");

    const hint =
        document.getElementById("hint");

    wrongAttempts = 0;
    answerShown = false;
    questionCompleted = false;

    input.value = "";

    input.classList.remove(
        "input-correct",
        "input-wrong"
    );

    result.innerHTML = "";
    result.className = "result";

    hint.innerHTML =
        "Sai 3 lần sẽ hiện đáp án.";

    if(!data || data.length === 0){

        document
            .getElementById("question")
            .textContent =
            "Không có dữ liệu HSK " + currentHSK;

        return;
    }

    /*
       LẤY CÂU THEO ORDER RANDOM
    */

    const realIndex =
        progress.order[
            currentIndex % progress.order.length
        ];

    const item =
        data[realIndex];

    currentQuestion = {

        question:item[2],
        answer:item[0],
        pinyin:item[1]

    };

    document
        .getElementById("modeTitle")
        .textContent =
        "HSK " +
        currentHSK +
        " • LUYỆN VIẾT";

    document
        .getElementById("question")
        .textContent =
        currentQuestion.question;

    updateProgress();
    updateStats();

    setTimeout(function(){

        input.focus();

    },50);
}

/* =====================================================
   NORMALIZE
===================================================== */

function normalizeText(text){

    return String(text)
        .trim()
        .replace(/\s+/g,"")
        .replace(
            /[，。！？、,.!?;；:：'"“”‘’`]/g,
            ""
        );
}

/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(){

    if(!currentQuestion){
        return;
    }

    if(questionCompleted){
        return;
    }

    const input =
        document.getElementById("answerInput");

    const userAnswer =
        normalizeText(input.value);

    if(!userAnswer){
        return;
    }

    const correctAnswer =
        normalizeText(
            currentQuestion.answer
        );

    /* ĐÚNG */

    if(userAnswer === correctAnswer){

        questionCompleted = true;

        correctCount++;
        doneCount++;

        input.classList.remove(
            "input-wrong"
        );

        input.classList.add(
            "input-correct"
        );

        const result =
            document.getElementById("result");

        result.className =
            "result correct";

        result.innerHTML =
            '<div class="answer">' +
            escapeHTML(
                currentQuestion.answer
            ) +
            '</div>' +
            '<div class="answer-pinyin">' +
            escapeHTML(
                currentQuestion.pinyin
            ) +
            '</div>';

        saveLastQuestion();
        saveCurrentProgress();
        updateStats();

        nextTimer =
            setTimeout(function(){

                currentIndex++;

                saveCurrentProgress();

                loadQuestion();

            },1500);

        return;
    }

    /* SAI */

    /*
       Sau 3 lần sai:
       không tăng wrong nữa.
    */

    if(!answerShown){

        wrongAttempts++;
        wrongCount++;

    }

    input.classList.remove(
        "input-correct"
    );

    input.classList.add(
        "input-wrong"
    );

    saveCurrentProgress();
    updateStats();

    /* SAI LẦN 2 */

    if(wrongAttempts === 2){

        showPinyinInitials();

    }

    /* SAI LẦN 3 */

    if(
        wrongAttempts >= 3 &&
        !answerShown
    ){

        answerShown = true;

        showAnswerAfterThreeWrong();

    }
}

/* =====================================================
   PINYIN HINT
===================================================== */

function showPinyinInitials(){

    const hint =
        document.getElementById("hint");

    const pinyin =
        String(
            currentQuestion.pinyin
        ).trim();

    const initials =
        pinyin
            .split(/\s+/)
            .map(function(word){

                return word
                    ? word.charAt(0)
                    : "";

            })
            .join("");

    hint.innerHTML =
        "Gợi ý Pinyin: " +
        escapeHTML(initials);
}

/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswerAfterThreeWrong(){

    const result =
        document.getElementById("result");

    result.className =
        "result wrong";

    result.innerHTML =
        '<div class="answer">' +
        escapeHTML(
            currentQuestion.answer
        ) +
        '</div>' +
        '<div class="answer-pinyin">' +
        escapeHTML(
            currentQuestion.pinyin
        ) +
        '</div>';

    document
        .getElementById("hint")
        .innerHTML =
        "Hãy gõ lại đúng đáp án để tiếp tục.";
}

/* =====================================================
   SAVE LAST QUESTION
===================================================== */

function saveLastQuestion(){

    lastQuestion = {

        question:currentQuestion.question,
        answer:currentQuestion.answer,
        pinyin:currentQuestion.pinyin

    };

    hasPreviousQuestion = true;
}

/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function showPreviousQuestion(){

    if(
        !hasPreviousQuestion ||
        !lastQuestion
    ){

        document
            .getElementById("hint")
            .innerHTML =
            "Chưa có câu vừa làm.";

        return;
    }

    if(nextTimer){

        clearTimeout(nextTimer);
        nextTimer = null;

    }

    currentQuestion = {

        question:lastQuestion.question,
        answer:lastQuestion.answer,
        pinyin:lastQuestion.pinyin

    };

    questionCompleted = true;
    answerShown = true;

    document
        .getElementById("question")
        .textContent =
        lastQuestion.question;

    const input =
        document.getElementById("answerInput");

    input.value = "";

    input.classList.remove(
        "input-wrong"
    );

    input.classList.add(
        "input-correct"
    );

    const result =
        document.getElementById("result");

    result.className =
        "result correct";

    result.innerHTML =
        '<div class="answer">' +
        escapeHTML(
            lastQuestion.answer
        ) +
        '</div>' +
        '<div class="answer-pinyin">' +
        escapeHTML(
            lastQuestion.pinyin
        ) +
        '</div>';

    document
        .getElementById("hint")
        .innerHTML =
        "Đây là câu vừa làm.";
}

/* =====================================================
   MANUAL SHUFFLE
===================================================== */

function shuffleCurrentLevel(){

    if(nextTimer){

        clearTimeout(nextTimer);
        nextTimer = null;

    }

    /*
       CHỈ RANDOM HSK HIỆN TẠI
    */

    randomizeLevel(currentHSK);

    currentIndex = 0;

    saveUser();

    loadQuestion();
}

/* =====================================================
   SAVE PROGRESS
===================================================== */

function saveCurrentProgress(){

    if(!currentUser){
        return;
    }

    const progress =
        getLevelProgress(currentHSK);

    progress.index =
        currentIndex;

    progress.correct =
        correctCount;

    progress.wrong =
        wrongCount;

    progress.done =
        doneCount;

    currentUser.lastHSK =
        currentHSK;

    saveUser();
}

/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document
        .getElementById("correctCount")
        .textContent =
        correctCount;

    document
        .getElementById("wrongCount")
        .textContent =
        wrongCount;

    document
        .getElementById("doneCount")
        .textContent =
        doneCount;

    let accuracy = 0;

    if(doneCount > 0){

        accuracy =
            Math.round(
                (
                    correctCount /
                    doneCount
                ) * 100
            );
    }

    document
        .getElementById("accuracy")
        .textContent =
        accuracy + "%";
}

/* =====================================================
   PROGRESS BAR
===================================================== */

function updateProgress(){

    const data =
        hskData[currentHSK];

    if(!data || data.length === 0){

        document
            .getElementById("progressFill")
            .style.width = "0%";

        return;
    }

    const position =
        currentIndex % data.length;

    const percent =
        ((position + 1) / data.length) * 100;

    document
        .getElementById("progressFill")
        .style.width =
        percent + "%";
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =====================================================
   ENTER = CHECK
===================================================== */

document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                checkAnswer();
            }
        }
    );

/* =====================================================
   ENTER = START
===================================================== */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                startLearning();
            }
        }
    );

/* =====================================================
   INIT
===================================================== */

(function init(){

    const savedUser =
        getSavedUser();

    if(!savedUser){

        showNameScreen();

        return;
    }

    currentUser =
        savedUser;

    ensureUserData();

    saveUser();

    showContinueScreen();

})();
</script>
