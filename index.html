<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HỌC TIẾNG TRUNG HSK3</title>

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#1677ff,#005bea);
    color:white;
    border-radius:18px;
    padding:22px 15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:7px 0 0;
    font-size:14px;
    opacity:.95;
}

/* ================= MENU ================= */

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0;
}

.menu button{
    border:0;
    background:white;
    border-radius:13px;
    padding:12px 5px;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    transition:.2s;
}

.menu button.active{
    background:#1677ff;
    color:white;
}

.menu button:active{
    transform:scale(.97);
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.stat{
    background:white;
    border-radius:12px;
    padding:10px 5px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat-number{
    font-size:20px;
    font-weight:bold;
}

.stat-label{
    font-size:11px;
    color:#777;
    margin-top:2px;
}

/* ================= PROGRESS ================= */

.progress{
    height:7px;
    background:#dfe5ec;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:12px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#1677ff;
    transition:.3s;
}

/* ================= CARD ================= */

.card{
    background:white;
    border-radius:18px;
    padding:20px 17px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.mode-title{
    text-align:center;
    color:#1677ff;
    font-size:14px;
    font-weight:bold;
    margin-bottom:18px;
}

.question{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin:20px 0;
    min-height:42px;
    word-break:break-word;
}

.question.vi{
    font-size:24px;
}

.question.hanzi{
    font-size:40px;
}

.pinyin{
    text-align:center;
    font-size:20px;
    color:#1677ff;
    margin:10px 0;
    min-height:25px;
}

.example{
    background:#f4f7fb;
    border-radius:12px;
    padding:12px;
    margin-top:12px;
    line-height:1.6;
    font-size:14px;
}

.example-title{
    font-weight:bold;
    margin-bottom:4px;
}

input{
    width:100%;
    border:2px solid #d9dfe7;
    border-radius:12px;
    padding:14px;
    font-size:18px;
    outline:none;
    text-align:center;
    transition:.2s;
}

input:focus{
    border-color:#1677ff;
}

/* ================= BUTTON ================= */

.actions{
    margin-top:12px;
}

.actions button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px;
    background:#1677ff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.actions button:active{
    transform:scale(.98);
}

.bottom-buttons{
    margin-top:10px;
}

.bottom-buttons button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:12px;
    background:#eef3f8;
    color:#333;
    font-size:15px;
    cursor:pointer;
}

/* ================= RESULT ================= */

.result{
    margin-top:14px;
    padding:13px;
    border-radius:12px;
    font-size:15px;
    line-height:1.6;
}

.correct{
    background:#eaf8ef;
    color:#16733b;
}

.wrong{
    background:#fff0f0;
    color:#c62828;
}

.hint{
    margin-top:8px;
    background:#fff8df;
    color:#8a6500;
    padding:10px;
    border-radius:10px;
}

.answer{
    font-weight:bold;
    font-size:18px;
}

.info{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:14px;
}

.footer{
    height:15px;
}

/* ================= HIDDEN ================= */

.hidden{
    display:none;
}

/* ================= MOBILE ================= */

@media(max-width:430px){

    .container{
        padding:10px;
    }

    .header h1{
        font-size:22px;
    }

    .question{
        font-size:27px;
    }

    .question.vi{
        font-size:21px;
    }

    .question.hanzi{
        font-size:36px;
    }

    input{
        font-size:17px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="header">
        <h1>🇨🇳 HỌC TIẾNG TRUNG HSK3</h1>
        <p>Luyện từ vựng • chữ Hán • câu</p>
    </div>

    <!-- ================= MENU ================= -->

    <div class="menu">

        <button id="btnWrite" class="active" onclick="changeMode('write')">
            🀄<br>
            Luyện viết
        </button>

        <button id="btnVocab" onclick="changeMode('vocab')">
            📚<br>
            Từ vựng
        </button>

        <button id="btnSentence" onclick="changeMode('sentence')">
            💬<br>
            Luyện câu
        </button>

    </div>

    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="correctCount">0</div>
            <div class="stat-label">Đúng</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="wrongCount">0</div>
            <div class="stat-label">Sai</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="doneCount">0</div>
            <div class="stat-label">Đã làm</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="accuracy">0%</div>
            <div class="stat-label">Tỷ lệ</div>
        </div>

    </div>

    <!-- ================= PROGRESS ================= -->

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- ================= CARD ================= -->

    <div class="card">

        <div class="mode-title" id="modeTitle">
            LUYỆN VIẾT CHỮ HÁN
        </div>

        <div class="question vi" id="question">
            yêu thích
        </div>

        <div class="pinyin hidden" id="pinyin"></div>

        <input
            id="answerInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Nhập câu trả lời..."
        >

        <div class="actions">

            <button onclick="checkAnswer()">
                ✓ Kiểm tra
            </button>

        </div>

        <div id="result" class="result hidden"></div>

        <div id="example" class="example hidden"></div>

        <div class="bottom-buttons">

            <button onclick="nextQuestion()">
                → Câu tiếp
            </button>

        </div>

        <div class="info">
            Sai 3 lần sẽ hiện Pinyin gợi ý.
        </div>

    </div>

    <div class="footer"></div>

</div>


<script>

/* =========================================================
   FUNCTION 1
   DỮ LIỆU HỌC TỪ VỰNG
   ========================================================= */

let allVocabulary = [];

if(Array.isArray(window.HSK1)){
    allVocabulary = allVocabulary.concat(window.HSK1);
}

if(Array.isArray(window.HSK2)){
    allVocabulary = allVocabulary.concat(window.HSK2);
}

if(Array.isArray(window.HSK3)){
    allVocabulary = allVocabulary.concat(window.HSK3);
}


/* =========================================================
   FUNCTION 2
   TẠO DANH SÁCH CÂU HSK3
   ========================================================= */

let sentenceData = [];


/*
   Các mẫu câu dùng từ HSK3.
   Câu được tạo tự động dựa trên từ trong hsk3.js.
*/

const sentenceTemplates = [

    {
        vi: word => `Tôi rất thích ${word}.`,
        zh: word => `我很喜欢${word}。`
    },

    {
        vi: word => `Tôi thường ${word}.`,
        zh: word => `我经常${word}。`
    },

    {
        vi: word => `Tôi muốn ${word}.`,
        zh: word => `我想${word}。`
    },

    {
        vi: word => `Tôi không muốn ${word}.`,
        zh: word => `我不想${word}。`
    },

    {
        vi: word => `Tôi có thể ${word}.`,
        zh: word => `我可以${word}。`
    },

    {
        vi: word => `Tôi biết ${word}.`,
        zh: word => `我知道${word}。`
    },

    {
        vi: word => `Tôi không biết ${word}.`,
        zh: word => `我不知道${word}。`
    },

    {
        vi: word => `Tôi cảm thấy ${word} rất tốt.`,
        zh: word => `我觉得${word}很好。`
    },

    {
        vi: word => `Anh ấy đang ${word}.`,
        zh: word => `他正在${word}。`
    },

    {
        vi: word => `Cô ấy đang ${word}.`,
        zh: word => `她正在${word}。`
    },

    {
        vi: word => `Chúng tôi cùng nhau ${word}.`,
        zh: word => `我们一起${word}。`
    },

    {
        vi: word => `Hôm nay tôi muốn ${word}.`,
        zh: word => `今天我想${word}。`
    },

    {
        vi: word => `Ngày mai tôi sẽ ${word}.`,
        zh: word => `明天我会${word}。`
    },

    {
        vi: word => `Tôi đã ${word}.`,
        zh: word => `我已经${word}了。`
    },

    {
        vi: word => `Bạn có thể ${word} không?`,
        zh: word => `你可以${word}吗？`
    },

    {
        vi: word => `Bạn muốn ${word} không?`,
        zh: word => `你想${word}吗？`
    },

    {
        vi: word => `Tại sao bạn ${word}?`,
        zh: word => `你为什么${word}？`
    },

    {
        vi: word => `Khi nào bạn ${word}?`,
        zh: word => `你什么时候${word}？`
    },

    {
        vi: word => `Tôi đang học cách ${word}.`,
        zh: word => `我正在学习怎么${word}。`
    },

    {
        vi: word => `Tôi cần ${word}.`,
        zh: word => `我需要${word}。`
    }

];


/* =========================================================
   FUNCTION 3
   TẠO KHOẢNG 500 CÂU
   ========================================================= */

function buildSentenceData(){

    sentenceData = [];

    if(!Array.isArray(window.HSK3)){
        return;
    }

    for(let i = 0; i < window.HSK3.length; i++){

        const item = window.HSK3[i];

        if(!item || item.length < 3){
            continue;
        }

        const hanzi = String(item[0]).trim();
        const pinyin = String(item[1]).trim();
        const meaning = String(item[2]).trim();

        if(!hanzi || !pinyin || !meaning){
            continue;
        }

        for(let t = 0; t < sentenceTemplates.length; t++){

            const template = sentenceTemplates[t];

            sentenceData.push({

                hanzi:hanzi,

                pinyin:pinyin,

                meaning:meaning,

                question:template.vi(meaning),

                answer:template.zh(hanzi),

                example:template.zh(hanzi)

            });

            if(sentenceData.length >= 500){
                return;
            }

        }

    }

}


/* =========================================================
   FUNCTION 4
   XÁO TRỘN TỰ ĐỘNG KHI MỞ TRANG
   ========================================================= */

function shuffleArray(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        const temp = array[i];

        array[i] = array[j];

        array[j] = temp;

    }

}


/* =========================================================
   FUNCTION 5
   BIẾN CHUỖI THÀNH DẠNG SO SÁNH
   ========================================================= */

function normalizeText(text){

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/[.,!?;:，。！？；：、]/g,"");

}


/* =========================================================
   FUNCTION 6
   BIẾN CHẾ ĐỘ
   ========================================================= */

let currentMode = "write";

let currentQuestion = null;

let currentIndex = 0;

let wrongAttempts = 0;

let questionFinished = false;


/* =========================================================
   FUNCTION 7
   THỐNG KÊ
   ========================================================= */

let correctCount = 0;
let wrongCount = 0;
let doneCount = 0;


/* =========================================================
   FUNCTION 8
   ĐỔI CHẾ ĐỘ
   ========================================================= */

function changeMode(mode){

    currentMode = mode;

    currentIndex = 0;

    wrongAttempts = 0;

    questionFinished = false;

    document.getElementById("btnWrite").classList.remove("active");
    document.getElementById("btnVocab").classList.remove("active");
    document.getElementById("btnSentence").classList.remove("active");

    if(mode === "write"){

        document.getElementById("btnWrite").classList.add("active");

    }

    if(mode === "vocab"){

        document.getElementById("btnVocab").classList.add("active");

    }

    if(mode === "sentence"){

        document.getElementById("btnSentence").classList.add("active");

    }

    loadQuestion();

}


/* =========================================================
   FUNCTION 9
   LẤY CÂU HỎI
   ========================================================= */

function loadQuestion(){

    wrongAttempts = 0;

    questionFinished = false;

    const input = document.getElementById("answerInput");

    const result = document.getElementById("result");

    const pinyin = document.getElementById("pinyin");

    const example = document.getElementById("example");

    input.value = "";

    result.className = "result hidden";

    result.innerHTML = "";

    pinyin.className = "pinyin hidden";

    pinyin.innerHTML = "";

    example.className = "example hidden";

    example.innerHTML = "";


    /* ================= LẤY DỮ LIỆU ================= */

    if(currentMode === "write"){

        if(allVocabulary.length === 0){
            return;
        }

        currentQuestion =
            allVocabulary[currentIndex % allVocabulary.length];

    }


    if(currentMode === "vocab"){

        if(allVocabulary.length === 0){
            return;
        }

        currentQuestion =
            allVocabulary[currentIndex % allVocabulary.length];

    }


    if(currentMode === "sentence"){

        if(sentenceData.length === 0){
            return;
        }

        currentQuestion =
            sentenceData[currentIndex % sentenceData.length];

    }


    /* ================= HIỂN THỊ ================= */

    const question = document.getElementById("question");

    const modeTitle = document.getElementById("modeTitle");


    if(currentMode === "write"){

        modeTitle.innerHTML = "LUYỆN VIẾT CHỮ HÁN";

        question.className = "question vi";

        question.innerHTML = currentQuestion[2];

    }


    if(currentMode === "vocab"){

        modeTitle.innerHTML = "LUYỆN TỪ VỰNG";

        question.className = "question hanzi";

        question.innerHTML = currentQuestion[0];

    }


    if(currentMode === "sentence"){

        modeTitle.innerHTML = "LUYỆN CÂU HSK3";

        question.className = "question vi";

        question.innerHTML = currentQuestion.question;

    }


    updateProgress();

    setTimeout(function(){

        input.focus();

    },100);

}


/* =========================================================
   FUNCTION 10
   KIỂM TRA ĐÁP ÁN
   ========================================================= */

function checkAnswer(){

    if(questionFinished){
        return;
    }

    if(!currentQuestion){
        return;
    }

    const input =
        document.getElementById("answerInput");

    const userAnswer =
        input.value.trim();

    if(!userAnswer){
        input.focus();
        return;
    }


    let correctAnswer = "";

    let correctPinyin = "";

    let exampleText = "";


    /* ================= LUYỆN VIẾT ================= */

    if(currentMode === "write"){

        correctAnswer = currentQuestion[0];

        correctPinyin = currentQuestion[1];

    }


    /* ================= TỪ VỰNG ================= */

    if(currentMode === "vocab"){

        correctAnswer = currentQuestion[2];

        correctPinyin = currentQuestion[1];

    }


    /* ================= LUYỆN CÂU ================= */

    if(currentMode === "sentence"){

        correctAnswer = currentQuestion.answer;

        correctPinyin = currentQuestion.pinyin;

        exampleText = currentQuestion.example;

    }


    const userNormalized =
        normalizeText(userAnswer);

    const answerNormalized =
        normalizeText(correctAnswer);


    const isCorrect =
        userNormalized === answerNormalized;


    /* =====================================================
       ĐÚNG
       ===================================================== */

    if(isCorrect){

        correctCount++;

        doneCount++;

        questionFinished = true;

        showStats();

        const result =
            document.getElementById("result");

        result.className =
            "result correct";

        result.innerHTML =
            "✓ <b>Chính xác!</b><br>" +
            "Đáp án: <span class='answer'>" +
            escapeHTML(correctAnswer) +
            "</span>";


        showPinyin(correctPinyin);


        if(currentMode === "sentence"){

            showExample(exampleText);

        }


        /*
           Tự chuyển sang câu tiếp theo
        */

        setTimeout(function(){

            nextQuestion();

        },850);

        return;

    }


    /* =====================================================
       SAI
       ===================================================== */

    wrongAttempts++;

    wrongCount++;

    showStats();


    const result =
        document.getElementById("result");

    result.className =
        "result wrong";


    if(wrongAttempts < 3){

        result.innerHTML =
            "✗ <b>Chưa đúng.</b><br>" +
            "Bạn còn " +
            (3 - wrongAttempts) +
            " lần thử.";

        if(wrongAttempts >= 2){

            showPinyin(correctPinyin);

        }

        return;

    }


    /* =====================================================
       SAI 3 LẦN
       ===================================================== */

    doneCount++;

    questionFinished = true;

    showStats();

    result.className =
        "result wrong";

    result.innerHTML =
        "✗ <b>Đã hết 3 lần thử.</b><br>" +
        "Đáp án đúng: " +
        "<span class='answer'>" +
        escapeHTML(correctAnswer) +
        "</span>";


    showPinyin(correctPinyin);


    if(currentMode === "sentence"){

        showExample(exampleText);

    }

}


/* =========================================================
   FUNCTION 11
   HIỂN THỊ PINYIN
   ========================================================= */

function showPinyin(text){

    const pinyin =
        document.getElementById("pinyin");

    pinyin.className = "pinyin";

    pinyin.innerHTML =
        escapeHTML(text);

}


/* =========================================================
   FUNCTION 12
   HIỂN THỊ CÂU VÍ DỤ
   ========================================================= */

function showExample(text){

    const example =
        document.getElementById("example");

    example.className = "example";

    example.innerHTML =
        "<div class='example-title'>Câu:</div>" +
        escapeHTML(text);

}


/* =========================================================
   FUNCTION 13
   CÂU TIẾP
   ========================================================= */

function nextQuestion(){

    currentIndex++;

    loadQuestion();

}


/* =========================================================
   FUNCTION 14
   THỐNG KÊ
   ========================================================= */

function showStats(){

    document.getElementById("correctCount")
        .innerText = correctCount;

    document.getElementById("wrongCount")
        .innerText = wrongCount;

    document.getElementById("doneCount")
        .innerText = doneCount;


    let total =
        correctCount + wrongCount;

    let accuracy = 0;

    if(total > 0){

        accuracy =
            Math.round(
                (correctCount / total) * 100
            );

    }

    document.getElementById("accuracy")
        .innerText = accuracy + "%";

}


/* =========================================================
   FUNCTION 15
   THANH TIẾN ĐỘ
   ========================================================= */

function updateProgress(){

    let total = 0;

    if(currentMode === "sentence"){

        total = sentenceData.length;

    }else{

        total = allVocabulary.length;

    }

    if(total <= 0){
        return;
    }

    let percent =
        ((currentIndex % total) / total) * 100;

    document.getElementById("progressFill")
        .style.width = percent + "%";

}


/* =========================================================
   FUNCTION 16
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FUNCTION 17
   PHÍM ENTER
   ========================================================= */

document.getElementById("answerInput")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            checkAnswer();

        }

    });


/* =========================================================
   FUNCTION 18
   KHỞI ĐỘNG WEBSITE
   ========================================================= */

function init(){

    buildSentenceData();

    /*
       Chỉ xáo trộn tự động khi mở trang.
       Không còn nút Xáo trộn.
    */

    shuffleArray(allVocabulary);

    shuffleArray(sentenceData);

    currentMode = "write";

    currentIndex = 0;

    correctCount = 0;

    wrongCount = 0;

    doneCount = 0;

    showStats();

    loadQuestion();

}


/* =========================================================
   START
   ========================================================= */

init();

</script>

</body>
</html>
