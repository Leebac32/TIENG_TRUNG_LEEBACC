<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIẾNG TRUNG LEEBACC</title>

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

/* =========================
   HEADER
========================= */

.header {
    background: linear-gradient(135deg, #1677ff, #005bea);
    color: white;
    border-radius: 18px;
    padding: 22px 15px;
    text-align: center;
    margin-bottom: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: 0.95;
}

/* =========================
   MENU
========================= */

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.menu button {
    border: none;
    background: white;
    border-radius: 12px;
    padding: 10px 5px;
    font-size: 14px;
    font-weight: 600;
    color: #444;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.menu button.active {
    background: #1677ff;
    color: white;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.stat {
    background: white;
    border-radius: 12px;
    padding: 9px 4px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.stat-number {
    font-size: 20px;
    font-weight: 700;
}

.stat-label {
    font-size: 11px;
    color: #777;
    margin-top: 2px;
}

/* =========================
   PROGRESS
========================= */

.progress {
    height: 7px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #1677ff;
    transition: width 0.25s;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.07);
}

.mode-title {
    text-align: center;
    font-size: 14px;
    color: #1677ff;
    font-weight: 700;
    margin-bottom: 18px;
}

.question {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    min-height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
}

.question.vi {
    font-size: 24px;
    color: #333;
}

.question.hanzi {
    font-size: 34px;
}

.pinyin {
    text-align: center;
    font-size: 20px;
    color: #1677ff;
    font-weight: 600;
    min-height: 28px;
    margin-bottom: 10px;
}

.example {
    background: #f4f8ff;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    text-align: center;
    color: #333;
    font-size: 14px;
    min-height: 0;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 20px;
    text-align: center;
    outline: none;
    transition: 0.2s;
    background: white;
}

input:focus {
    border-color: #1677ff;
}

.input-correct {
    border-color: #22c55e !important;
    background: #f0fdf4 !important;
    color: #15803d !important;
}

.input-wrong {
    border-color: #ef4444 !important;
    background: #fef2f2 !important;
    color: #dc2626 !important;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.actions button {
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    background: #1677ff;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.actions button:active {
    transform: scale(0.98);
}

/* =========================
   RESULT
========================= */

.result {
    margin-top: 12px;
    text-align: center;
    min-height: 0;
}

.result.correct {
    color: #16a34a;
}

.result.wrong {
    color: #dc2626;
}

.answer {
    margin-top: 6px;
    font-size: 21px;
    font-weight: 700;
    color: #222;
}

.answer-pinyin {
    margin-top: 4px;
    color: #1677ff;
    font-size: 17px;
    font-weight: 600;
}

/*
   Giữ khu vực kết quả ổn định.
   Không chèn dòng "Sai" riêng nên giao diện
   không bị đẩy lên xuống khi trả lời sai.
*/
.result-space {
    min-height: 5px;
}

/* =========================
   INFO
========================= */

.info {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-top: 14px;
    min-height: 18px;
}

.hint {
    color: #f59e0b;
    font-weight: 600;
    margin-top: 5px;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 430px) {

    .container {
        padding: 10px;
    }

    .header {
        padding: 18px 10px;
    }

    .header h1 {
        font-size: 22px;
    }

    .card {
        padding: 16px;
    }

    .question.vi {
        font-size: 21px;
    }

    .question.hanzi {
        font-size: 30px;
    }

    input {
        font-size: 18px;
    }

    .actions button {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">
        <h1>🇨🇳 TIẾNG TRUNG LEEBACC</h1>
        <p>Luyện từ vựng • chữ Hán • câu</p>
    </div>

    <!-- =========================
         MENU
    ========================== -->

    <div class="menu">

        <button id="modeWrite" class="active" onclick="setMode('write')">
            🀄<br>
            Luyện viết
        </button>

        <button id="modeVocab" onclick="setMode('vocab')">
            📚<br>
            Từ vựng
        </button>

        <button id="modeSentence" onclick="setMode('sentence')">
            💬<br>
            Luyện câu
        </button>

    </div>

    <!-- =========================
         STATS
    ========================== -->

    <div class="stats">

        <div class="stat">
            <div id="correctCount" class="stat-number">0</div>
            <div class="stat-label">Đúng</div>
        </div>

        <div class="stat">
            <div id="wrongCount" class="stat-number">0</div>
            <div class="stat-label">Sai</div>
        </div>

        <div class="stat">
            <div id="doneCount" class="stat-number">0</div>
            <div class="stat-label">Đã làm</div>
        </div>

        <div class="stat">
            <div id="accuracy" class="stat-number">0%</div>
            <div class="stat-label">Tỷ lệ</div>
        </div>

    </div>

    <!-- =========================
         PROGRESS
    ========================== -->

    <div class="progress">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <!-- =========================
         MAIN CARD
    ========================== -->

    <div class="card">

        <div id="modeTitle" class="mode-title">
            LUYỆN VIẾT CHỮ HÁN
        </div>

        <div id="question" class="question vi">
            yêu thích
        </div>

        <div id="pinyin" class="pinyin"></div>

        <input
            id="answerInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Nhập câu trả lời..."
        >

        <!--
            Chỉ còn 2 nút:
            Câu vừa làm
            Trợ giúp
        -->

        <div class="actions">

            <button onclick="showPreviousQuestion()">
                ← Câu vừa làm
            </button>

            <button onclick="showHelp()">
                💡 Trợ giúp
            </button>

        </div>

        <div id="result" class="result">
        </div>

        <div id="example" class="example hidden">
        </div>

        <div id="hint" class="info">
            Sai 3 lần sẽ hiện Pinyin gợi ý.
        </div>

    </div>

</div>


<script>

/* =========================================================
   DỮ LIỆU
========================================================= */

let allVocabulary = [];

if (Array.isArray(window.HSK1)) {
    allVocabulary = allVocabulary.concat(window.HSK1);
}

if (Array.isArray(window.HSK2)) {
    allVocabulary = allVocabulary.concat(window.HSK2);
}

if (Array.isArray(window.HSK3)) {
    allVocabulary = allVocabulary.concat(window.HSK3);
}


/* =========================================================
   HSK3
========================================================= */

let hsk3Vocabulary = Array.isArray(window.HSK3)
    ? [...window.HSK3]
    : [];


/* =========================================================
   TẠO KHOẢNG 500 CÂU LUYỆN CÂU
========================================================= */

const sentenceTemplates = [

    {
        vi: word => `Tôi rất thích ${word}.`,
        zh: word => `我很喜欢${word}。`
    },

    {
        vi: word => `Tôi thường ${word}.`,
        zh: word => `我经常${word}。`
    },

    {
        vi: word => `Tôi muốn ${word}.`,
        zh: word => `我想${word}。`
    },

    {
        vi: word => `Tôi không muốn ${word}.`,
        zh: word => `我不想${word}。`
    },

    {
        vi: word => `Tôi có thể ${word}.`,
        zh: word => `我可以${word}。`
    },

    {
        vi: word => `Tôi không thể ${word}.`,
        zh: word => `我不能${word}。`
    },

    {
        vi: word => `Tôi biết ${word}.`,
        zh: word => `我知道${word}。`
    },

    {
        vi: word => `Tôi không biết ${word}.`,
        zh: word => `我不知道${word}。`
    },

    {
        vi: word => `Tôi đang ${word}.`,
        zh: word => `我正在${word}。`
    },

    {
        vi: word => `Hôm nay tôi sẽ ${word}.`,
        zh: word => `今天我要${word}。`
    },

    {
        vi: word => `Ngày mai tôi sẽ ${word}.`,
        zh: word => `明天我要${word}。`
    },

    {
        vi: word => `Tôi muốn học ${word}.`,
        zh: word => `我想学习${word}。`
    },

    {
        vi: word => `Tôi thích học ${word}.`,
        zh: word => `我喜欢学习${word}。`
    },

    {
        vi: word => `Tôi đang học ${word}.`,
        zh: word => `我正在学习${word}。`
    },

    {
        vi: word => `Tôi cần ${word}.`,
        zh: word => `我需要${word}。`
    },

    {
        vi: word => `Tôi không cần ${word}.`,
        zh: word => `我不需要${word}。`
    },

    {
        vi: word => `Tôi muốn hỏi ${word}.`,
        zh: word => `我想问${word}。`
    },

    {
        vi: word => `Tôi muốn nói về ${word}.`,
        zh: word => `我想说说${word}。`
    },

    {
        vi: word => `Tôi đã thấy ${word}.`,
        zh: word => `我已经看见${word}了。`
    },

    {
        vi: word => `Tôi đã nghe ${word}.`,
        zh: word => `我已经听到了${word}。`
    }

];


/* =========================================================
   TẠO CÂU
========================================================= */

let sentenceData = [];

function buildSentenceData() {

    sentenceData = [];

    if (hsk3Vocabulary.length === 0) {
        return;
    }

    let index = 0;

    /*
       Tạo khoảng 500 câu.
       Mỗi từ HSK3 sẽ được xoay vòng qua các mẫu.
    */

    while (sentenceData.length < 500) {

        const item = hsk3Vocabulary[index % hsk3Vocabulary.length];

        const hanzi = item[0];
        const pinyin = item[1];
        const meaning = item[2];

        const template =
            sentenceTemplates[
                sentenceData.length % sentenceTemplates.length
            ];

        sentenceData.push({

            vi: template.vi(meaning),

            zh: template.zh(hanzi),

            pinyin: pinyin,

            meaning: meaning,

            hanzi: hanzi

        });

        index++;
    }
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        const temp = array[i];

        array[i] = array[j];

        array[j] = temp;
    }

}


/* =========================================================
   DỮ LIỆU LUYỆN VIẾT
========================================================= */

let writeData = [];


/* =========================================================
   DỮ LIỆU TỪ VỰNG
========================================================= */

let vocabData = [];


/* =========================================================
   MODE
========================================================= */

let currentMode = "write";

let currentIndex = 0;


/* =========================================================
   THỐNG KÊ
========================================================= */

let correctCount = 0;
let wrongCount = 0;
let doneCount = 0;


/* =========================================================
   CÂU HIỆN TẠI
========================================================= */

let currentQuestion = null;

let wrongAttempts = 0;

let questionFinished = false;


/* =========================================================
   CÂU VỪA LÀM
========================================================= */

let lastQuestion = null;
let lastMode = null;

let hasPreviousQuestion = false;


/* =========================================================
   TIMER
========================================================= */

let nextTimer = null;


/* =========================================================
   KHỞI TẠO
========================================================= */

function init() {

    writeData = [...allVocabulary];

    vocabData = [...allVocabulary];

    buildSentenceData();

    shuffle(writeData);
    shuffle(vocabData);
    shuffle(sentenceData);

    currentIndex = 0;

    loadQuestion();
}


/* =========================================================
   ĐỔI MODE
========================================================= */

function setMode(mode) {

    if (nextTimer) {
        clearTimeout(nextTimer);
        nextTimer = null;
    }

    currentMode = mode;

    currentIndex = 0;

    wrongAttempts = 0;

    questionFinished = false;

    hasPreviousQuestion = false;

    lastQuestion = null;

    lastMode = null;

    shuffle(writeData);
    shuffle(vocabData);
    shuffle(sentenceData);

    document
        .getElementById("modeWrite")
        .classList.remove("active");

    document
        .getElementById("modeVocab")
        .classList.remove("active");

    document
        .getElementById("modeSentence")
        .classList.remove("active");


    if (mode === "write") {

        document
            .getElementById("modeWrite")
            .classList.add("active");

    }

    else if (mode === "vocab") {

        document
            .getElementById("modeVocab")
            .classList.add("active");

    }

    else {

        document
            .getElementById("modeSentence")
            .classList.add("active");

    }


    loadQuestion();
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const input =
        document.getElementById("answerInput");

    const result =
        document.getElementById("result");

    const pinyin =
        document.getElementById("pinyin");

    const example =
        document.getElementById("example");

    const hint =
        document.getElementById("hint");


    wrongAttempts = 0;

    questionFinished = false;


    input.value = "";

    input.classList.remove(
        "input-correct",
        "input-wrong"
    );


    result.innerHTML = "";

    result.className = "result";


    pinyin.innerHTML = "";

    example.innerHTML = "";

    example.classList.add("hidden");


    hint.innerHTML =
        "Sai 3 lần sẽ hiện Pinyin gợi ý.";


    if (currentMode === "write") {

        if (writeData.length === 0) {
            return;
        }

        const item =
            writeData[currentIndex % writeData.length];

        currentQuestion = {

            question: item[2],

            answer: item[0],

            pinyin: item[1],

            example: "",

            type: "write"

        };


        document
            .getElementById("modeTitle")
            .textContent =
            "LUYỆN VIẾT CHỮ HÁN";


        const question =
            document.getElementById("question");

        question.className =
            "question vi";

        question.textContent =
            currentQuestion.question;

    }


    else if (currentMode === "vocab") {

        if (vocabData.length === 0) {
            return;
        }

        const item =
            vocabData[currentIndex % vocabData.length];

        currentQuestion = {

            question: item[0],

            answer: item[2],

            pinyin: item[1],

            example: "",

            type: "vocab"

        };


        document
            .getElementById("modeTitle")
            .textContent =
            "LUYỆN TỪ VỰNG";


        const question =
            document.getElementById("question");

        question.className =
            "question hanzi";

        question.textContent =
            currentQuestion.question;

    }


    else {

        if (sentenceData.length === 0) {
            return;
        }

        const item =
            sentenceData[
                currentIndex % sentenceData.length
            ];


        currentQuestion = {

            question: item.vi,

            answer: item.zh,

            pinyin: makeSentencePinyin(item),

            example:
                item.hanzi +
                " — " +
                item.pinyin,

            type: "sentence"

        };


        document
            .getElementById("modeTitle")
            .textContent =
            "LUYỆN CÂU HSK3";


        const question =
            document.getElementById("question");

        question.className =
            "question vi";

        question.textContent =
            currentQuestion.question;

    }


    updateProgress();


    setTimeout(function() {

        input.focus();

    }, 50);

}


/* =========================================================
   TẠO PINYIN CHO CÂU
========================================================= */

function makeSentencePinyin(item) {

    return item.pinyin;
}


/* =========================================================
   CHUẨN HÓA CÂU TRẢ LỜI
========================================================= */

function normalizeText(text) {

    return String(text)

        .trim()

        .toLowerCase()

        .replace(/\s+/g, "")

        .replace(/[，。！？、,.!?;；:：'"“”‘’`]/g, "");

}


/* =========================================================
   KIỂM TRA
========================================================= */

function checkAnswer() {

    if (!currentQuestion) {
        return;
    }

    if (questionFinished) {
        return;
    }


    const input =
        document.getElementById("answerInput");


    const userAnswer =
        normalizeText(input.value);


    if (!userAnswer) {
        return;
    }


    const correctAnswer =
        normalizeText(currentQuestion.answer);


    /* =========================
       ĐÚNG
    ========================== */

    if (userAnswer === correctAnswer) {

        questionFinished = true;

        correctCount++;

        doneCount++;


        input.classList.remove(
            "input-wrong"
        );

        input.classList.add(
            "input-correct"
        );


        const result =
            document.getElementById("result");


        result.className =
            "result correct";


        result.innerHTML =

            "✓ Chính xác!" +

            '<div class="answer">' +
            escapeHTML(currentQuestion.answer) +
            '</div>' +

            '<div class="answer-pinyin">' +
            escapeHTML(currentQuestion.pinyin) +
            '</div>';


        if (currentQuestion.type === "sentence") {

            showExample();

        }


        saveLastQuestion();


        updateStats();


        /*
           Đợi 3 giây để người dùng nhìn thấy
           đáp án trước khi sang câu mới.
        */

        nextTimer = setTimeout(function() {

            currentIndex++;

            loadQuestion();

        }, 1500);


        return;
    }


    /* =========================
       SAI
    ========================== */

    wrongAttempts++;

    wrongCount++;


    /*
       Chỉ đổi màu ô nhập.
       KHÔNG thêm dòng "Sai".
       KHÔNG làm giao diện bị đẩy lên.
    */

    input.classList.remove(
        "input-correct"
    );

    input.classList.add(
        "input-wrong"
    );


    updateStats();


    /*
       Sai lần 2:
       hiện Pinyin gợi ý.
    */

    if (wrongAttempts >= 2) {

        showPinyinHint();

    }


    /*
       Sai lần 3:
       hiện đáp án.
    */

    if (wrongAttempts >= 3) {

        questionFinished = true;

        doneCount++;


        const result =
            document.getElementById("result");


        result.className =
            "result wrong";


        result.innerHTML =

            '<div class="answer">' +
            escapeHTML(currentQuestion.answer) +
            '</div>' +

            '<div class="answer-pinyin">' +
            escapeHTML(currentQuestion.pinyin) +
            '</div>';


        if (currentQuestion.type === "sentence") {

            showExample();

        }


        saveLastQuestion();

        updateStats();

    }

}


/* =========================================================
   HIỂN THỊ PINYIN
========================================================= */

function showPinyinHint() {

    const hint =
        document.getElementById("hint");


    hint.innerHTML =
        "Gợi ý Pinyin: " +
        getPinyinInitials(
            currentQuestion.pinyin
        );

}


/* =========================================================
   TRỢ GIÚP
========================================================= */

function showHelp() {

    if (!currentQuestion) {
        return;
    }


    const hint =
        document.getElementById("hint");


    hint.innerHTML =
        "Gợi ý Pinyin: " +
        getPinyinInitials(
            currentQuestion.pinyin
        );

}


/* =========================================================
   LẤY CHỮ CÁI ĐẦU PINYIN
========================================================= */

function getPinyinInitials(pinyin) {

    if (!pinyin) {
        return "";
    }


    const words =
        String(pinyin)
            .trim()
            .split(/\s+/);


    return words
        .map(function(word) {

            if (!word) {
                return "";
            }

            return word.charAt(0);

        })
        .join("");

}


/* =========================================================
   HIỂN THỊ VÍ DỤ
========================================================= */

function showExample() {

    if (!currentQuestion.example) {
        return;
    }


    const example =
        document.getElementById("example");


    example.innerHTML =
        "<strong>Ví dụ:</strong><br>" +
        escapeHTML(
            currentQuestion.example
        );


    example.classList.remove(
        "hidden"
    );

}


/* =========================================================
   LƯU CÂU VỪA LÀM
========================================================= */

function saveLastQuestion() {

    lastQuestion = {

        question:
            currentQuestion.question,

        answer:
            currentQuestion.answer,

        pinyin:
            currentQuestion.pinyin,

        example:
            currentQuestion.example,

        type:
            currentQuestion.type

    };


    lastMode = currentMode;

    hasPreviousQuestion = true;

}


/* =========================================================
   CÂU VỪA LÀM
========================================================= */

function showPreviousQuestion() {

    if (!hasPreviousQuestion || !lastQuestion) {

        const hint =
            document.getElementById("hint");

        hint.innerHTML =
            "Chưa có câu vừa làm.";

        return;
    }


    if (nextTimer) {

        clearTimeout(nextTimer);

        nextTimer = null;

    }


    currentQuestion = {

        question:
            lastQuestion.question,

        answer:
            lastQuestion.answer,

        pinyin:
            lastQuestion.pinyin,

        example:
            lastQuestion.example,

        type:
            lastQuestion.type

    };


    questionFinished = true;


    const question =
        document.getElementById("question");


    if (lastQuestion.type === "write") {

        question.className =
            "question vi";

    }

    else if (lastQuestion.type === "vocab") {

        question.className =
            "question hanzi";

    }

    else {

        question.className =
            "question vi";

    }


    question.textContent =
        lastQuestion.question;


    document
        .getElementById("modeTitle")
        .textContent =
        lastQuestion.type === "write"
            ? "LUYỆN VIẾT CHỮ HÁN"
            : lastQuestion.type === "vocab"
                ? "LUYỆN TỪ VỰNG"
                : "LUYỆN CÂU HSK3";


    const input =
        document.getElementById("answerInput");


    input.value = "";

    input.classList.remove(
        "input-wrong"
    );

    input.classList.add(
        "input-correct"
    );


    const result =
        document.getElementById("result");


    result.className =
        "result correct";


    result.innerHTML =

        '<div class="answer">' +
        escapeHTML(lastQuestion.answer) +
        '</div>' +

        '<div class="answer-pinyin">' +
        escapeHTML(lastQuestion.pinyin) +
        '</div>';


    if (lastQuestion.example) {

        const example =
            document.getElementById("example");


        example.innerHTML =
            "<strong>Ví dụ:</strong><br>" +
            escapeHTML(
                lastQuestion.example
            );


        example.classList.remove(
            "hidden"
        );

    }


    const hint =
        document.getElementById("hint");


    hint.innerHTML =
        "Đây là câu vừa làm.";

}


/* =========================================================
   THỐNG KÊ
========================================================= */

function updateStats() {

    document
        .getElementById("correctCount")
        .textContent =
        correctCount;


    document
        .getElementById("wrongCount")
        .textContent =
        wrongCount;


    document
        .getElementById("doneCount")
        .textContent =
        doneCount;


    let accuracy = 0;


    if (doneCount > 0) {

        accuracy =
            Math.round(
                (correctCount / doneCount) * 100
            );

    }


    document
        .getElementById("accuracy")
        .textContent =
        accuracy + "%";


    updateProgress();

}


/* =========================================================
   TIẾN ĐỘ
========================================================= */

function updateProgress() {

    let total = 1;

    if (currentMode === "write") {

        total = writeData.length;

    }

    else if (currentMode === "vocab") {

        total = vocabData.length;

    }

    else {

        total = sentenceData.length;

    }


    if (total <= 0) {
        total = 1;
    }


    let position =
        currentIndex % total;


    let percent =
        ((position + 1) / total) * 100;


    document
        .getElementById("progressFill")
        .style.width =
        percent + "%";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   ENTER = KIỂM TRA
========================================================= */

document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                checkAnswer();

            }

        }
    );


/* =========================================================
   START
========================================================= */

init();

</script>
