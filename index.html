<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TIẾNG TRUNG LEEBACC</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    background: white;
}

/* =========================
   HEADER
========================= */

.header {
    background: #c62828;
    color: white;
    text-align: center;
    padding: 18px 12px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 5px 0 0;
    font-size: 13px;
}


/* =========================
   SCREEN
========================= */

.screen {
    display: none;
    padding: 22px 18px;
}

.screen.active {
    display: block;
}


/* =========================
   LEVEL
========================= */

.level-title {
    text-align: center;
    margin-bottom: 25px;
}

.level-title h2 {
    margin-bottom: 8px;
}

.level-title p {
    color: #777;
}

.level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.level-card {
    background: white;
    border: 2px solid #ddd;
    border-radius: 14px;
    padding: 20px 5px;
    font-size: 15px;
    font-weight: bold;
}

.level-card:active {
    transform: scale(.97);
}

.level-card strong {
    display: block;
    color: #c62828;
    font-size: 24px;
    margin-bottom: 8px;
}


/* =========================
   BUTTON
========================= */

.btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: bold;
}

.primary {
    background: #c62828;
    color: white;
}

.secondary {
    background: #eeeeee;
    color: #333;
}


/* =========================
   STUDY
========================= */

.study {
    text-align: center;
}

.counter {
    font-size: 13px;
    color: #888;
    margin-bottom: 18px;
}

.progress {
    height: 7px;
    background: #eeeeee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #c62828;
    transition: width .2s;
}


/* =========================
   VIETNAMESE MEANING
========================= */

.meaning {
    min-height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;

    font-size: 30px;
    font-weight: bold;
    text-align: center;
}


/* =========================
   HINT
========================= */

.hint {
    color: #888;
    font-size: 14px;
    margin: 8px 0 18px;
}


/* =========================
   INPUT
========================= */

.answer-input {
    width: 100%;

    padding: 16px;

    border: 2px solid #dddddd;
    border-radius: 12px;

    outline: none;

    font-size: 21px;
    text-align: center;
}

.answer-input:focus {
    border-color: #c62828;
}


/* =========================
   RESULT
========================= */

.result {
    min-height: 30px;

    margin-top: 14px;

    font-size: 17px;
    font-weight: bold;
}

.result.correct {
    color: #2e7d32;
}

.result.wrong {
    color: #c62828;
}


/* =========================
   ANSWER
========================= */

.solution {
    margin-top: 12px;

    padding: 15px;

    border-radius: 12px;

    background: #fff3f3;

    font-size: 20px;
    line-height: 1.5;
}

.solution b {
    color: #c62828;
}


/* =========================
   NOTE
========================= */

.note {
    margin-top: 18px;

    text-align: center;

    font-size: 12px;
    color: #999;

    line-height: 1.5;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .level-grid {
        grid-template-columns: 1fr;
    }

    .meaning {
        font-size: 26px;
    }

}

</style>
</head>


<body>


<div class="app">


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>TIẾNG TRUNG LEEBACC</h1>

    <p>
        HSK · Luyện Pinyin → Tiếng Trung
    </p>

</div>



<!-- =========================
     LEVEL SCREEN
========================= -->

<section
    id="levelScreen"
    class="screen active"
>

    <div class="level-title">

        <h2>
            Chọn cấp độ HSK
        </h2>

        <p>
            Chọn cấp độ để bắt đầu
        </p>

    </div>


    <div class="level-grid">


        <button
            class="level-card"
            onclick="startLevel(1)"
        >

            <strong>
                HSK 1
            </strong>

            300 từ

        </button>



        <button
            class="level-card"
            onclick="startLevel(2)"
        >

            <strong>
                HSK 2
            </strong>

            500 từ

        </button>



        <button
            class="level-card"
            onclick="startLevel(3)"
        >

            <strong>
                HSK 3
            </strong>

            1000 từ

        </button>


    </div>

</section>



<!-- =========================
     STUDY SCREEN
========================= -->

<section
    id="studyScreen"
    class="screen study"
>


    <div class="counter">

        HSK
        <span id="levelText">
            1
        </span>

        ·

        <span id="countText">
            1 / 300
        </span>

    </div>



    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar"
        ></div>

    </div>



    <!-- TIẾNG VIỆT -->

    <div
        id="meaning"
        class="meaning"
    >
        ...
    </div>



    <div class="hint">

        Nhập Pinyin để gõ chữ Trung

    </div>



    <!-- Ô NHẬP -->

    <input
        id="answerInput"
        class="answer-input"

        type="text"

        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"

        placeholder="Nhập Pinyin..."
    >



    <!-- KẾT QUẢ -->

    <div
        id="result"
        class="result"
    ></div>



    <!-- ĐÁP ÁN -->

    <div
        id="solution"
        class="solution"
        style="display:none;"
    ></div>



    <!-- QUAY LẠI -->

    <button
        class="btn secondary"
        onclick="backToLevel()"
    >

        ← Đổi HSK

    </button>



    <div class="note">

        Sai 3 lần sẽ hiện đáp án.<br>

        Sau khi hiện đáp án,
        bạn phải nhập lại đúng
        mới được sang từ tiếp theo.

    </div>


</section>


</div>



<!-- =========================
     VOCABULARY
========================= -->

<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>



<script>

/* =========================================================
   BIẾN
========================================================= */

let currentLevel = 1;

let currentWords = [];

let randomWords = [];

let currentWord = null;

let wrongCount = 0;

let mustRepeatAnswer = false;

let completedCount = 0;


/* =========================================================
   LẤY DỮ LIỆU HSK
========================================================= */

function getVocabulary(level) {

    let data = [];


    /*
       HSK1
    */

    if (
        level >= 1 &&
        Array.isArray(window.HSK1)
    ) {

        data = data.concat(
            window.HSK1
        );

    }


    /*
       HSK2
    */

    if (
        level >= 2 &&
        Array.isArray(window.HSK2)
    ) {

        data = data.concat(
            window.HSK2
        );

    }


    /*
       HSK3
    */

    if (
        level >= 3 &&
        Array.isArray(window.HSK3)
    ) {

        data = data.concat(
            window.HSK3
        );

    }


    /*
       Chuyển dữ liệu thành object
    */

    const words = data.map(
        function(item) {

            return {

                hanzi: item[0] || "",

                pinyin: item[1] || "",

                meaning: item[2] || ""

            };

        }
    );


    /*
       Xóa bản ghi trùng hoàn toàn
    */

    const seen = new Set();


    return words.filter(
        function(word) {

            const key =
                word.hanzi +
                "|" +
                word.pinyin +
                "|" +
                word.meaning;


            if (seen.has(key)) {

                return false;

            }


            seen.add(key);

            return true;

        }
    );

}


/* =========================================================
   RANDOM
========================================================= */

function shuffle(array) {

    const copy =
        array.slice();


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        const temp =
            copy[i];


        copy[i] =
            copy[j];


        copy[j] =
            temp;

    }


    return copy;

}


/* =========================================================
   CHUẨN HÓA PINYIN
========================================================= */

function normalizePinyin(text) {

    return String(text || "")
        .trim()
        .toLowerCase()

        /*
           Chuyển:

           ǚ → u
           ǎ → a
           ò → o

           để có thể nhập
           cả pinyin có dấu
           hoặc không dấu.
        */

        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")

        /*
           Bỏ số thanh điệu
        */

        .replace(/[1-5]/g, "")

        /*
           Bỏ khoảng trắng
        */

        .replace(/[\s'-]/g, "");

}


/* =========================================================
   KIỂM TRA PINYIN
========================================================= */

function isCorrect(input, word) {

    return (
        normalizePinyin(input) ===
        normalizePinyin(word.pinyin)
    );

}


/* =========================================================
   CHỌN HSK
========================================================= */

function startLevel(level) {

    currentLevel =
        level;


    currentWords =
        getVocabulary(level);


    if (!currentWords.length) {

        alert(
            "Chưa có dữ liệu HSK."
        );

        return;

    }


    /*
       Random toàn bộ danh sách
    */

    randomWords =
        shuffle(currentWords);


    currentWord = null;

    wrongCount = 0;

    mustRepeatAnswer = false;

    completedCount = 0;


    /*
       Lưu cấp độ
    */

    localStorage.setItem(
        "leebacc_level",
        String(level)
    );


    document.getElementById(
        "levelText"
    ).textContent =
        level;


    document.getElementById(
        "countText"
    ).textContent =
        "0 / " +
        currentWords.length;


    showScreen(
        "studyScreen"
    );


    /*
       Lấy từ random đầu tiên
    */

    nextRandomWord();

}


/* =========================================================
   TỪ RANDOM TIẾP THEO
========================================================= */

function nextRandomWord() {


    /*
       Nếu đã dùng hết danh sách
       thì xáo lại từ đầu
    */

    if (
        randomWords.length === 0
    ) {

        randomWords =
            shuffle(currentWords);

    }


    /*
       Lấy một từ
    */

    currentWord =
        randomWords.pop();


    /*
       Reset số lần sai
    */

    wrongCount = 0;

    mustRepeatAnswer = false;


    /*
       Hiện nghĩa tiếng Việt
    */

    document.getElementById(
        "meaning"
    ).textContent =
        currentWord.meaning;


    /*
       Xóa ô nhập
    */

    const input =
        document.getElementById(
            "answerInput"
        );


    input.value = "";

    input.disabled = false;


    /*
       Xóa thông báo
    */

    document.getElementById(
        "result"
    ).textContent = "";


    document.getElementById(
        "result"
    ).className =
        "result";


    /*
       Ẩn đáp án
    */

    document.getElementById(
        "solution"
    ).style.display =
        "none";


    /*
       Cập nhật số từ
    */

    completedCount++;


    document.getElementById(
        "countText"
    ).textContent =

        completedCount +
        " / " +
        currentWords.length;


    /*
       Thanh tiến độ

       Khi hết danh sách,
       nó sẽ random lại.
    */

    const percent =
        Math.min(
            completedCount,
            currentWords.length
        )
        /
        currentWords.length
        *
        100;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";


    /*
       Đưa con trỏ vào ô nhập
    */

    setTimeout(
        function() {

            input.focus();

        },
        50
    );

}


/* =========================================================
   KIỂM TRA ĐÁP ÁN
========================================================= */

function checkAnswer() {

    if (!currentWord) {

        return;

    }


    const input =
        document.getElementById(
            "answerInput"
        );


    const value =
        input.value.trim();


    if (!value) {

        return;

    }


    /*
       ĐÚNG
    */

    if (
        isCorrect(
            value,
            currentWord
        )
    ) {


        /*
           Nếu đây là trường hợp
           đã sai 3 lần và phải nhập
           lại đáp án.
        */

        if (mustRepeatAnswer) {

            document.getElementById(
                "result"
            ).textContent =
                "✓ Đúng! Sang từ tiếp theo.";

        }

        else {

            document.getElementById(
                "result"
            ).textContent =
                "✓ Chính xác!";

        }


        document.getElementById(
            "result"
        ).className =
            "result correct";


        /*
           Chờ một chút rồi sang từ mới
        */

        setTimeout(
            function() {

                nextRandomWord();

            },
            500
        );


        return;

    }


    /*
       SAI
    */

    wrongCount++;


    document.getElementById(
        "result"
    ).textContent =

        "✗ Sai lần " +
        wrongCount +
        "/3";


    document.getElementById(
        "result"
    ).className =
        "result wrong";


    /*
       SAI 3 LẦN
    */

    if (
        wrongCount >= 3
    ) {

        mustRepeatAnswer = true;


        /*
           Hiện đáp án
        */

        document.getElementById(
            "solution"
        ).innerHTML =

            "Đáp án: <b>" +

            escapeHTML(
                currentWord.hanzi
            ) +

            "</b> — " +

            escapeHTML(
                currentWord.pinyin
            );


        document.getElementById(
            "solution"
        ).style.display =
            "block";


        document.getElementById(
            "result"
        ).textContent =

            "Đã sai 3 lần. Hãy nhập lại đáp án đúng.";


        /*
           Không khóa ô nhập.
           Người dùng phải tự gõ lại.
        */

        input.value = "";

        input.focus();

    }

}


/* =========================================================
   ENTER ĐỂ KIỂM TRA
========================================================= */

document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                checkAnswer();

            }

        }
    );


/* =========================================================
   HIỂN THỊ SCREEN
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(
            function(screen) {

                screen.classList.remove(
                    "active"
                );

            }
        );


    const target =
        document.getElementById(id);


    if (target) {

        target.classList.add(
            "active"
        );

    }


    window.scrollTo(
        0,
        0
    );

}


/* =========================================================
   QUAY LẠI CHỌN HSK
========================================================= */

function backToLevel() {

    showScreen(
        "levelScreen"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   DEBUG
========================================================= */

console.log(
    "HSK1:",
    Array.isArray(window.HSK1)
        ? window.HSK1.length
        : "Không tìm thấy"
);

console.log(
    "HSK2:",
    Array.isArray(window.HSK2)
        ? window.HSK2.length
        : "Không tìm thấy"
);

console.log(
    "HSK3:",
    Array.isArray(window.HSK3)
        ? window.HSK3.length
        : "Không tìm thấy"
);

</script>

</body>
</html>
