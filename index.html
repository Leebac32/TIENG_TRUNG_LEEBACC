<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luyện viết tiếng Trung HSK3</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 600px;
    margin: auto;
}

.header {
    background: white;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
    margin: 0 0 8px;
    font-size: 24px;
}

.subtitle {
    color: #6b7280;
    font-size: 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.stat {
    background: #f3f4f6;
    border-radius: 10px;
    padding: 10px 5px;
}

.stat-number {
    font-size: 20px;
    font-weight: bold;
}

.stat-label {
    font-size: 12px;
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.progress {
    color: #6b7280;
    font-size: 14px;
    text-align: center;
    margin-bottom: 18px;
}

.vietnamese {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin: 20px 0;
}

.label {
    display: block;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 55px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    padding: 0 15px;
    font-size: 24px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 11px;
    margin-top: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.check {
    background: #2563eb;
    color: white;
}

.next {
    background: #16a34a;
    color: white;
}

.shuffle {
    background: #f59e0b;
    color: white;
}

.reset {
    background: #e5e7eb;
    color: #111827;
}

.result {
    text-align: center;
    min-height: 30px;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.correct {
    color: #16a34a;
}

.wrong {
    color: #dc2626;
}

.hint {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #fff7ed;
    color: #c2410c;
    text-align: center;
    font-size: 18px;
}

.answer {
    margin-top: 12px;
    padding: 14px;
    border-radius: 10px;
    background: #eff6ff;
    text-align: center;
}

.hanzi {
    font-size: 28px;
    font-weight: bold;
}

.pinyin {
    font-size: 20px;
    color: #2563eb;
    margin-top: 5px;
}

.info {
    margin-top: 15px;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    line-height: 1.5;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    margin: 20px 0;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>🇨🇳 LUYỆN VIẾT TIẾNG TRUNG</h1>

        <div class="subtitle">
            HSK3 • Nhìn tiếng Việt → Viết chữ Hán
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="correctCount">0</div>
                <div class="stat-label">Đúng</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="wrongCount">0</div>
                <div class="stat-label">Sai</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Đã làm</div>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="progress" id="progress">
            Câu 1 / 200
        </div>

        <div class="label" style="text-align:center;">
            Viết tiếng Trung:
        </div>

        <div class="vietnamese" id="vietnamese">
            -
        </div>

        <input
            id="answerInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Nhập chữ Hán..."
        >

        <button class="check" onclick="checkAnswer()">
            KIỂM TRA
        </button>

        <button class="next" onclick="nextWord()">
            CÂU TIẾP THEO
        </button>

        <button class="shuffle" onclick="shuffleWords()">
            🔀 XÁO TRỘN 200 TỪ
        </button>

        <button class="reset" onclick="resetGame()">
            ↺ LÀM LẠI
        </button>

        <div id="result" class="result"></div>

        <div id="hint" class="hint" style="display:none;"></div>

        <div id="answer" class="answer" style="display:none;">

            <div class="label">
                Đáp án
            </div>

            <div class="hanzi" id="correctHanzi"></div>

            <div class="pinyin" id="correctPinyin"></div>

        </div>

    </div>


    <div class="info">

        Gõ đúng chữ Hán → Pinyin xuất hiện.<br>
        Sai 1–2 lần → chưa hiện Pinyin.<br>
        Sai lần 3 → Pinyin xuất hiện làm gợi ý.

    </div>


    <div class="footer">
        HSK3 Chinese Practice
    </div>

</div>

/*
==================================================
BIẾN TRÒ CHƠI
==================================================
*/

let currentIndex = 0;

let wrongAttempts = 0;

let correctCount = 0;

let wrongCount = 0;

let totalCount = 0;

let finishedCurrent = false;


/*
==================================================
LẤY ELEMENT
==================================================
*/

const vietnamese =
    document.getElementById("vietnamese");

const answerInput =
    document.getElementById("answerInput");

const result =
    document.getElementById("result");

const hint =
    document.getElementById("hint");

const answer =
    document.getElementById("answer");

const correctHanzi =
    document.getElementById("correctHanzi");

const correctPinyin =
    document.getElementById("correctPinyin");

const progress =
    document.getElementById("progress");


/*
==================================================
HIỂN THỊ TỪ
==================================================
*/

function showWord() {

    const word =
        words[currentIndex];

    vietnamese.textContent =
        word.vi;

    progress.textContent =
        "Câu " +
        (currentIndex + 1) +
        " / " +
        words.length;

    answerInput.value = "";

    result.textContent = "";

    result.className =
        "result";

    hint.style.display =
        "none";

    answer.style.display =
        "none";

    wrongAttempts = 0;

    finishedCurrent = false;

    answerInput.focus();
}


/*
==================================================
 CHUẨN HÓA INPUT
==================================================
*/

function cleanText(text) {

    return String(text)
        .trim()
        .replace(/\s+/g, "");

}


/*
==================================================
KIỂM TRA
==================================================
*/

function checkAnswer() {

    if (finishedCurrent) {
        return;
    }

    const userAnswer =
        cleanText(answerInput.value);

    const word =
        words[currentIndex];

    if (userAnswer === "") {

        result.textContent =
            "⚠️ Hãy nhập chữ Hán.";

        result.className =
            "result wrong";

        return;
    }


    /*
    ĐÚNG
    */

    if (userAnswer === word.han) {

        correctCount++;

        totalCount++;

        finishedCurrent = true;

        result.textContent =
            "✅ CHÍNH XÁC!";

        result.className =
            "result correct";

        correctHanzi.textContent =
            word.han;

        correctPinyin.textContent =
            word.py;

        answer.style.display =
            "block";

        updateStats();

        return;
    }


    /*
    SAI
    */

    wrongAttempts++;

    wrongCount++;

    totalCount++;

    result.textContent =
        "❌ Chưa đúng. Lần " +
        wrongAttempts;

    result.className =
        "result wrong";


    /*
    SAI 3 LẦN
    */

    if (wrongAttempts >= 3) {

        hint.innerHTML =
            "💡 Gợi ý Pinyin: <b>" +
            word.py +
            "</b>";

        hint.style.display =
            "block";

        correctHanzi.textContent =
            word.han;

        correctPinyin.textContent =
            word.py;

        answer.style.display =
            "block";

        finishedCurrent = true;

    }

    updateStats();
}


/*
==================================================
CÂU TIẾP THEO
==================================================
*/

function nextWord() {

    currentIndex++;

    if (currentIndex >= words.length) {

        currentIndex = 0;

        alert(
            "🎉 Bạn đã hoàn thành " +
            words.length +
            " từ!"
        );
    }

    showWord();
}


/*
==================================================
CẬP NHẬT THỐNG KÊ
==================================================
*/

function updateStats() {

    document.getElementById(
        "correctCount"
    ).textContent =
        correctCount;

    document.getElementById(
        "wrongCount"
    ).textContent =
        wrongCount;

    document.getElementById(
        "totalCount"
    ).textContent =
        totalCount;
}


/*
==================================================
XÁO TRỘN
==================================================
*/

function shuffleWords() {

    for (
        let i = words.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            words[i],
            words[j]
        ] =
        [
            words[j],
            words[i]
        ];
    }

    currentIndex = 0;

    showWord();

    alert("🔀 Đã xáo trộn 200 từ!");
}


/*
==================================================
LÀM LẠI
==================================================
*/

function resetGame() {

    currentIndex = 0;

    wrongAttempts = 0;

    correctCount = 0;

    wrongCount = 0;

    totalCount = 0;

    finishedCurrent = false;

    updateStats();

    showWord();
}


/*
==================================================
ENTER = KIỂM TRA
==================================================
*/

answerInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            checkAnswer();

        }

    }
);


/*
==================================================
KHỞI ĐỘNG
==================================================
*/

showWord();

</script>
